<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회의록 분석 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* 회의록 분석 대시보드 */
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f3f2ee;
  --surface-3: #ebeae4;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --shadow: 0 1px 2px rgba(11, 11, 11, 0.04), 0 4px 16px rgba(11, 11, 11, 0.04);
  --accent: #2a78d6;
  --accent-soft: #e6f0fc;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --good-ink: #006300; --critical-ink: #b42323;
  --neutral: #b9b8b0;
  --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #256abf; --seq-6: #184f95; --seq-7: #0d366b;
  --radius: 14px;
  --font: "Pretendard", "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222220; --surface-3: #2c2c2a;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
    --border: rgba(255, 255, 255, 0.10); --shadow: none;
    --accent: #3987e5; --accent-soft: #1b2a3d;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --good-ink: #0ca30c; --critical-ink: #e66767; --neutral: #5a5955;
    --seq-1: #104281; --seq-2: #184f95; --seq-3: #1c5cab; --seq-4: #256abf; --seq-5: #3987e5; --seq-6: #6da7ec; --seq-7: #9ec5f4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222220; --surface-3: #2c2c2a;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835;
  --border: rgba(255, 255, 255, 0.10); --shadow: none;
  --accent: #3987e5; --accent-soft: #1b2a3d;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --good-ink: #0ca30c; --critical-ink: #e66767; --neutral: #5a5955;
  --seq-1: #104281; --seq-2: #184f95; --seq-3: #1c5cab; --seq-4: #256abf; --seq-5: #3987e5; --seq-6: #6da7ec; --seq-7: #9ec5f4;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink); font-family: var(--font);
  font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 헤더 ---------- */
.app-header {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 18px 24px 14px; max-width: 1480px; margin: 0 auto;
}
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 320px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 10px; background: var(--ink); color: var(--page);
  display: grid; place-items: center; flex: none;
}
.brand h1 { font-size: 19px; margin: 0; letter-spacing: -0.01em; font-weight: 700; }
.brand p { margin: 0; color: var(--ink-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px;
  border-radius: 9px; border: 1px solid var(--border); background: var(--surface); font-weight: 600; font-size: 13px;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--ink); color: var(--page); border-color: transparent; }
.btn.primary:hover { opacity: .9; }
.btn.icon { width: 36px; padding: 0; justify-content: center; }
.btn svg { width: 16px; height: 16px; flex: none; }
.dataset-pill {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2);
  border: 1px solid var(--border); padding: 4px 10px; border-radius: 999px; background: var(--surface);
}
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

/* ---------- 필터 바 ---------- */
.filter-wrap { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--page) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.filter-bar {
  max-width: 1480px; margin: 0 auto; padding: 10px 24px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
}
.filter-label { font-size: 11.5px; color: var(--muted); font-weight: 600; margin-right: 2px; }
.fgroup { display: inline-flex; align-items: center; gap: 4px; }
.chip {
  height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
  font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.chip:hover { background: var(--surface-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: transparent; }
.chip .glyph { font-size: 11px; line-height: 1; }
.fsep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }
.dd { position: relative; }
.dd-btn { height: 30px; padding: 0 10px 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.dd-btn .count { background: var(--accent); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 6px; line-height: 17px; }
.dd-btn svg { width: 14px; height: 14px; color: var(--muted); }
.dd-panel {
  position: absolute; top: calc(100% + 6px); left: 0; min-width: 240px; max-height: 340px; overflow: auto; z-index: 40;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.14); padding: 6px;
}
.dd-panel label { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px; font-size: 13px; cursor: pointer; }
.dd-panel label:hover { background: var(--surface-2); }
.dd-panel .dd-foot { display: flex; justify-content: space-between; padding: 6px 8px 2px; border-top: 1px solid var(--border); margin-top: 4px; }
.dd-panel .dd-foot button { background: none; border: 0; color: var(--accent); font-size: 12px; font-weight: 600; }
.date-in { height: 30px; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 0 8px; font-size: 12.5px; }
.search-in { height: 30px; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 0 10px; font-size: 12.5px; width: 170px; }
.filter-status { margin-left: auto; font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.filter-status b { color: var(--ink); }
.link-btn { background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 12.5px; padding: 0; }

/* ---------- 탭 ---------- */
.tabs { max-width: 1480px; margin: 0 auto; padding: 0 24px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  background: none; border: 0; padding: 12px 12px 10px; font-size: 13.5px; font-weight: 600; color: var(--ink-2);
  border-bottom: 2px solid transparent; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.tab .num { font-size: 10.5px; color: var(--muted); font-weight: 700; }

main { max-width: 1480px; margin: 0 auto; padding: 18px 24px 64px; }
.panel { display: none; }
.panel.active { display: block; }
.panel-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 4px 0 14px; flex-wrap: wrap; }
.panel-head h2 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
.panel-head p { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }

/* ---------- 그리드·카드 ---------- */
.grid { display: grid; gap: 14px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; }
.c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c9 { grid-column: span 9; } .c12 { grid-column: span 12; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 16px 12px;
  box-shadow: var(--shadow); min-width: 0; display: flex; flex-direction: column;
}
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.card-title { font-size: 13.5px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 6px; }
.card-sub { font-size: 12px; color: var(--muted); margin: 1px 0 0; }
.card-tools { display: flex; gap: 4px; align-items: center; flex: none; }
.mini-btn { height: 26px; padding: 0 8px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); font-size: 11.5px; color: var(--ink-2); }
.mini-btn:hover { background: var(--surface-2); }
.mini-btn[aria-pressed="true"] { background: var(--surface-3); color: var(--ink); }
.chart { width: 100%; min-height: 160px; height: 280px; flex: none; }
.chart.h160 { height: 160px; min-height: 160px; } .chart.h200 { height: 200px; min-height: 200px; }
.chart.h240 { height: 240px; } .chart.h280 { height: 280px; } .chart.h320 { height: 320px; } .chart.h360 { height: 360px; }
.chart.h420 { height: 420px; } .chart.h480 { height: 480px; }
.badge-ai {
  font-size: 10px; font-weight: 700; letter-spacing: .02em; padding: 1px 6px; border-radius: 5px;
  background: color-mix(in srgb, var(--s7) 14%, transparent); color: var(--s7); white-space: nowrap;
}
.badge-src { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 5px; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.empty { color: var(--muted); font-size: 13px; padding: 28px 8px; text-align: center; }

/* 개요 카드 */
.ov-card { cursor: pointer; transition: border-color .15s, transform .15s; }
.ov-card:hover { border-color: color-mix(in srgb, var(--ink) 30%, transparent); }
.ov-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ov-num { font-size: 12px; color: var(--muted); font-weight: 700; }
.ov-hero { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 2px 0 2px; }
.ov-hero .big { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.ov-hero .unit { font-size: 13px; color: var(--ink-2); font-weight: 600; }
.ov-hero .aside { font-size: 12px; color: var(--ink-2); }
.ov-more { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: auto; padding-top: 4px; }

/* 스탯 타일 */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); }
.tile .k { font-size: 12px; color: var(--ink-2); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.tile .v { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.25; }
.tile .v small { font-size: 13px; color: var(--ink-2); font-weight: 600; margin-left: 2px; }
.tile .d { font-size: 11.5px; color: var(--muted); }
.tile.hero { background: var(--ink); color: var(--page); border-color: transparent; }
.tile.hero .k, .tile.hero .d, .tile.hero .v small { color: color-mix(in srgb, var(--page) 70%, transparent); }

/* 상태 표기 */
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.st i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.idchip {
  display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 6px; font-size: 11.5px; font-weight: 700;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--ink); cursor: pointer; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.idchip:hover { border-color: var(--accent); color: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 10px 14px; font-size: 12px; color: var(--ink-2); margin: 2px 0 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend .sym { font-size: 12px; line-height: 1; }

/* 표 */
.tbl-wrap { overflow: auto; max-height: 520px; border: 1px solid var(--border); border-radius: 10px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl th { position: sticky; top: 0; background: var(--surface-2); text-align: left; font-weight: 700; color: var(--ink-2); padding: 8px 10px; white-space: nowrap; z-index: 1; }
.tbl td { padding: 8px 10px; border-top: 1px solid var(--border); vertical-align: top; }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tr:hover td { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
.tbl .clip { max-width: 360px; }
details.tbl-toggle { margin-top: 10px; }
details.tbl-toggle summary { cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--ink-2); padding: 4px 0; }

/* 회의 카드 그리드 */
.mcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.mcard { border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: var(--surface); cursor: pointer; display: flex; flex-direction: column; gap: 6px; text-align: left; }
.mcard:hover { border-color: color-mix(in srgb, var(--ink) 30%, transparent); }
.mcard .top { display: flex; justify-content: space-between; gap: 6px; align-items: center; }
.mcard .id { font-size: 11.5px; font-weight: 800; color: var(--muted); }
.mcard .title { font-size: 13px; font-weight: 700; line-height: 1.4; }
.mcard .meta { font-size: 11.5px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.mcard .depts { display: flex; gap: 3px; flex-wrap: wrap; }
.mcard .depts i { width: 16px; height: 6px; border-radius: 3px; display: inline-block; }
.nature-tag { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; }
.nature-정기 { background: color-mix(in srgb, var(--s1) 14%, transparent); color: var(--s1); }
.nature-임시 { background: color-mix(in srgb, var(--s2) 16%, transparent); color: var(--s2); }
.nature-긴급 { background: color-mix(in srgb, var(--critical) 16%, transparent); color: var(--critical-ink); }

/* 인사이트 카드 */
.insights { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.ins { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
.ins .cat { font-size: 11.5px; font-weight: 700; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.ins .cat svg { width: 15px; height: 15px; }
.ins .metric { display: flex; align-items: baseline; gap: 8px; }
.ins .metric b { font-size: 28px; letter-spacing: -0.02em; line-height: 1.1; }
.ins .metric span { font-size: 12px; color: var(--ink-2); }
.ins h4 { margin: 0; font-size: 14.5px; line-height: 1.4; }
.ins p { margin: 0; font-size: 13px; color: var(--ink-2); }
.ins .ev { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; padding-top: 4px; }
.cat-반복되는-문제 { --c: var(--s2); } .cat-의사결정-패턴 { --c: var(--s1); } .cat-성과-학습 { --c: var(--s3); }
.cat-병목 { --c: var(--s4); } .cat-리스크-신호 { --c: var(--critical); } .cat-성과-요약 { --c: var(--s7); } .cat-자동-분석 { --c: var(--muted); }
.ins { border-top: 3px solid var(--c, var(--border)); }
.ins .cat svg { color: var(--c); }
.summary-vs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sv { border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: var(--surface-2); }
.sv h5 { margin: 0 0 6px; font-size: 12px; color: var(--ink-2); }
.sv p { margin: 0; font-size: 13px; }

/* 위기 흐름 */
.flow { display: grid; grid-template-columns: 150px repeat(4, minmax(0, 1fr)); gap: 0; align-items: stretch; }
.flow + .flow { margin-top: 10px; }
.flow .lab { display: flex; flex-direction: column; justify-content: center; gap: 4px; padding-right: 10px; }
.flow .lab b { font-size: 13px; }
.flow .lab span { font-size: 11.5px; color: var(--ink-2); }
.flow .step { position: relative; background: var(--surface-2); border-radius: 10px; padding: 10px 12px 10px 14px; margin-right: 18px; font-size: 12.5px; border-left: 3px solid var(--c); }
.flow .step:last-child { margin-right: 0; }
.flow .step:not(:last-child)::after {
  content: ""; position: absolute; right: -14px; top: 50%; width: 10px; height: 10px; transform: translateY(-50%) rotate(45deg);
  border-top: 2px solid var(--axis); border-right: 2px solid var(--axis);
}
.flow .step small { display: block; font-size: 10.5px; font-weight: 700; color: var(--muted); margin-bottom: 2px; letter-spacing: .02em; }
.flow-head { display: grid; grid-template-columns: 150px repeat(4, minmax(0, 1fr)); margin-bottom: 6px; font-size: 11.5px; font-weight: 700; color: var(--ink-2); }
.flow-head span { padding-left: 14px; }
.sev { display: inline-flex; gap: 2px; }
.sev i { width: 10px; height: 4px; border-radius: 2px; background: var(--grid); display: inline-block; }
.sev i.on { background: var(--critical); }

/* 차년도 */
.pl-row { display: grid; grid-template-columns: 120px 1fr 1fr 1fr; gap: 0; align-items: stretch; }
.pl-row + .pl-row { margin-top: 8px; }
.pl-head { display: grid; grid-template-columns: 120px 1fr 1fr 1fr; font-size: 11.5px; font-weight: 700; color: var(--ink-2); margin-bottom: 6px; }
.pl-head span { padding-left: 12px; }
.pl-theme { font-size: 12.5px; font-weight: 700; display: flex; align-items: center; padding-right: 8px; }
.pl-cell { position: relative; padding: 10px 12px; border-radius: 10px; margin-right: 16px; font-size: 12.5px; background: var(--surface-2); }
.pl-cell:last-child { margin-right: 0; }
.pl-cell:not(:last-child)::after { content: "→"; position: absolute; right: -13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 700; }
.pl-cell.p { border-left: 3px solid var(--critical); }
.pl-cell.l { border-left: 3px solid var(--s4); }
.pl-cell.n { border-left: 3px solid var(--good); background: color-mix(in srgb, var(--good) 8%, var(--surface-2)); font-weight: 600; }
.pl-cell .ev { margin-top: 4px; }
.matrix { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mq { border-radius: 12px; padding: 12px 14px; border: 1px solid var(--border); background: var(--surface-2); }
.mq h5 { margin: 0 0 8px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.mq ul { margin: 0; padding-left: 18px; font-size: 12.5px; }
.mq li + li { margin-top: 3px; }
.mq.keep { border-top: 3px solid var(--s1); } .mq.stop { border-top: 3px solid var(--critical); }
.mq.improve { border-top: 3px solid var(--s4); } .mq.new { border-top: 3px solid var(--good); }
.kpt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

<script>
/*
 * 회의록 PDF 파서
 * 표준 회의록 양식(기본정보 + 섹션 01~08, 05A)을 위치 기반으로 읽어 구조화 JSON으로 변환한다.
 * 브라우저(pdf.js)와 Node(pdfjs-dist) 양쪽에서 동일하게 동작한다.
 */
(function (root) {
  'use strict';

  // 표준 양식의 섹션별 열 시작 x 좌표 (pt)
  var LAYOUT = {
    hdr: [44, 177, 310, 443],
    '01': [44, 150, 257, 363, 470],
    '02': [44, 310],
    '03': [44, 177, 310, 443],
    '04': [44, 177, 310, 443],
    '05': [44, 150, 257, 363, 470],
    '05A': [44, 310],
    '06': [44, 120, 196, 272, 348, 424, 500],
    '07': [44, 310],
    '08': [44, 310]
  };
  var ROW_GAP = 12.5;

  var HDR_LABELS = ['회의번호', '일시', '회의 성격', '회의 유형', '장소', '프로젝트 단계', '주재자', '기록자',
    '회의 소집 사유', '참석 부서', '참석자', '회의 목적', '안건'];

  function clean(s) {
    return String(s || '').replace(/\s+/g, ' ').replace(/\s([,.)])/g, '$1').trim();
  }

  // pdf.js 텍스트 아이템 → 줄 단위 묶음
  function toLines(items) {
    var its = items.filter(function (i) { return i.s && i.s.trim(); })
      .filter(function (i) { return i.y > 30 && i.y < 755; });
    its.sort(function (a, b) { return b.y - a.y || a.x - b.x; });
    var lines = [];
    its.forEach(function (it) {
      var L = null;
      for (var k = lines.length - 1; k >= 0 && k >= lines.length - 4; k--) {
        if (Math.abs(lines[k].y - it.y) < 2.5) { L = lines[k]; break; }
      }
      if (!L) { L = { y: it.y, its: [] }; lines.push(L); }
      L.its.push(it);
    });
    lines.forEach(function (L) { L.its.sort(function (a, b) { return a.x - b.x; }); });
    lines.sort(function (a, b) { return b.y - a.y; });
    return lines;
  }

  function joinItems(its) {
    var out = '', prevEnd = null;
    its.forEach(function (it) {
      if (prevEnd !== null && it.x - prevEnd > 1.2 && !/\s$/.test(out)) out += ' ';
      out += it.s;
      prevEnd = it.x + (it.w || 0);
    });
    return out;
  }

  function lineText(L) { return joinItems(L.its); }

  function colIndex(cols, x) {
    var idx = 0;
    for (var i = 0; i < cols.length; i++) if (x >= cols[i] - 3) idx = i;
    return idx;
  }

  // 여러 줄 셀 텍스트 결합.
  // pdf.js 는 줄 끝 공백을 버리므로, 한국어 어절 경계를 추정해 띄어쓰기를 복원한다.
  var WORD_END = /[는은를을의에며고서로과와및등후해된한할인여만도게면요다됨함음임짐]$/;
  function lineGlue(a, b) {
    if (/[.,;:)\]”’%]$/.test(a)) return ' ';
    if (/^[“‘(\[]/.test(b)) return ' ';
    if (/[A-Za-z0-9]$/.test(a) && /^[가-힣]/.test(b)) return ' ';
    if (/[가-힣]$/.test(a) && /^[A-Za-z0-9]/.test(b)) return ' ';
    if (/[가-힣]$/.test(a) && /^[가-힣]/.test(b) && WORD_END.test(a)) return ' ';
    return '';
  }
  function joinCellLines(parts) {
    var out = '';
    parts.forEach(function (p) {
      p = p.trim();
      if (!p) return;
      out = out ? out + lineGlue(out, p) + p : p;
    });
    return clean(out);
  }

  // 줄을 세그먼트(연속된 글자 묶음)로 나눈다. 열 경계는 큰 공백(>6pt)으로 구분된다.
  function segments(L, cols) {
    var segs = [], cur = null;
    L.its.forEach(function (it) {
      var atCol = cols && cols.some(function (c) { return Math.abs(it.x - c) < 1.5; });
      if (cur && it.x - cur.end < (atCol ? 2 : 6)) { cur.its.push(it); cur.end = it.x + (it.w || 0); }
      else { cur = { x: it.x, end: it.x + (it.w || 0), its: [it] }; segs.push(cur); }
    });
    return segs;
  }

  // 한 섹션의 줄들을 행(row) × 열(col) 셀로 분해
  function toRows(lines, cols) {
    var rows = [], cur = null, lastY = null;
    // 페이지 첫 줄: 그 줄이 속한 묶음(행)에 첫 열 글자가 있으면 새 행, 없으면 이전 페이지 행의 연속
    lines.forEach(function (L, i) {
      if (!L.pageStart) return;
      var has = false;
      for (var j = i; j < lines.length; j++) {
        if (j > i && lines[j - 1].y - lines[j].y > ROW_GAP) break;
        if (lines[j].its[0].x < cols[1] - 3) { has = true; break; }
      }
      L.pageNewRow = has;
    });
    lines.forEach(function (L) {
      var newRow = lastY === null || lastY - L.y > ROW_GAP || (L.pageStart && L.pageNewRow);
      if (newRow) { cur = { lines: [] }; rows.push(cur); }
      cur.lines.push(L);
      lastY = L.y;
    });
    return rows.map(function (r) {
      var cells = cols.map(function () { return []; });
      r.lines.forEach(function (L) {
        segments(L, cols).forEach(function (sg) { cells[colIndex(cols, sg.x)].push(joinItems(sg.its)); });
      });
      return cells.map(joinCellLines);
    });
  }

  function isHeaderRow(cells, words) {
    var t = cells.join(' ');
    return words.some(function (w) { return t.indexOf(w) >= 0; }) && !/^(D|A|OI)-\d/.test(cells[0]);
  }

  // ---------- 섹션별 해석 ----------
  function parseKV(rows) {
    var kv = {};
    rows.forEach(function (c) {
      var label = c[0];
      var val = c.slice(1).filter(Boolean).join(' ');
      if (label) kv[label] = clean((kv[label] ? kv[label] + ' ' : '') + val);
    });
    return kv;
  }

  function parseHeader(rows) {
    var kv = {};
    rows.forEach(function (c) {
      // [라벨0, 값0, 라벨1, 값1] 또는 [라벨0, '', 값(넓은 칸)]
      if (HDR_LABELS.indexOf(c[2]) >= 0) {
        if (c[0]) kv[c[0]] = clean(c[1]);
        kv[c[2]] = clean(c[3]);
      } else if (c[0]) {
        kv[c[0]] = clean([c[1], c[2], c[3]].filter(Boolean).join(' '));
      }
    });
    // "회의번호 ML-OL-001 일시 ..." 처럼 한 칸에 붙은 경우 대비
    return kv;
  }

  function splitList(s, sep) {
    return String(s || '').split(sep).map(clean).filter(Boolean);
  }

  var TITLE_RE = /\s*(대표이사|팀장|매니저|책임|AE|파트장|본부장|이사|실장|과장|대리|사원|선임|수석|담당|리드|PM|디자이너|연구원|품질책임|개발책임|MD|바이어|Account Director)$/;

  // 부서명 표준화 (외부 협력사는 외부 조직으로 묶는다)
  var DEPT_ALIAS = [
    [/^재무$|경영지원/, '경영지원·재무'],
    [/^브랜드|마케팅$/, '브랜드마케팅'],
    [/푸드앤코|ODM/, '외부 ODM'],
    [/스파크웍스|대행/, '외부 대행사'],
    [/^SCM|품질$/, 'SCM·품질']
  ];
  function normDept(d) {
    d = clean(d);
    for (var i = 0; i < DEPT_ALIAS.length; i++) if (DEPT_ALIAS[i][0].test(d)) return DEPT_ALIAS[i][1];
    return d;
  }

  function parseAttendees(s) {
    return splitList(s, /,|，/).map(function (p) {
      var m = p.match(/^([가-힣]{2,4})\s+(.+)$/);
      // 줄바꿈으로 이름과 직함이 붙은 경우: "이수민브랜드마케팅 매니저"
      if (!m || m[1].length > 3) m = p.match(/^([가-힣]{3})\s*(.+)$/) || m;
      if (!m) return { name: p, role: '', dept: '' };
      var role = clean(m[2]);
      return { name: m[1], role: role, dept: normDept(role.replace(TITLE_RE, '')) || role };
    });
  }

  function parseDateTime(s) {
    var m = String(s || '').match(/(\d{4})\.(\d{1,2})\.(\d{1,2})\s*\(?([월화수목금토일])?\)?\s*(\d{1,2}:\d{2})?\s*-?\s*(\d{1,2}:\d{2})?/);
    if (!m) return {};
    var date = m[1] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[3]).slice(-2);
    var dur = null;
    if (m[5] && m[6]) {
      var a = m[5].split(':'), b = m[6].split(':');
      dur = (+b[0] * 60 + +b[1]) - (+a[0] * 60 + +a[1]);
    }
    return { date: date, dow: m[4] || '', start: m[5] || '', end: m[6] || '', durationMin: dur };

    // 키워드 빈도 (논의+결정+이슈 전문)
    var corpus = ms.map(function (m) {

<script>
/*
 * 회의록 분석 대시보드 - 탭별 화면
 * 각 함수는 (panel, R, api)를 받아 해당 탭을 그린다. R 은 analytics.analyze 결과(필터 적용).
 */
(function () {
  'use strict';
  var A = window.MeetingAnalytics;
  var WARN = 'path://M12 1.8 L23 21.6 H1 Z';
  var SYM = { '정기': 'circle', '임시': 'triangle', '긴급': WARN };

  // ---------- 공용 조각 ----------
  function card(cls, title, sub, body, opts) {
    opts = opts || {};
    return '<div class="card ' + cls + (opts.click ? ' ov-card' : '') + '"' + (opts.click ? ' data-go="' + opts.click + '" tabindex="0" role="button"' : '') + '>' +
      '<div class="card-head"><div><h3 class="card-title">' + title + '</h3>' + (sub ? '<p class="card-sub">' + sub + '</p>' : '') + '</div>' +
      (opts.tools ? '<div class="card-tools">' + opts.tools + '</div>' : '') + '</div>' + body + '</div>';
  }
  function ch(id, h) { return '<div class="chart ' + (h || 'h280') + '" id="' + id + '"></div>'; }
  function ai(txt) { return '<span class="badge-ai" title="원문을 근거로 AI가 해석·정규화한 값">' + (txt || 'AI 분석') + '</span>'; }
  function src() { return '<span class="badge-src" title="회의록 원문에서 직접 추출·집계한 값">원문 추출</span>'; }
  function tile(k, v, unit, d, cls) {
    return '<div class="tile ' + (cls || '') + '"><div class="k">' + k + '</div><div class="v">' + v + (unit ? '<small>' + unit + '</small>' : '') + '</div>' + (d ? '<div class="d">' + d + '</div>' : '') + '</div>';
  }
  function head(title, desc, extra) {
    return '<div class="panel-head"><div><h2>' + title + '</h2><p>' + desc + '</p></div>' + (extra || '') + '</div>';
  }
  function legend(items) {
    return '<div class="legend">' + items.map(function (i) {
      return '<span>' + (i.sym ? '<b class="sym" style="color:' + i.c + '">' + i.sym + '</b>' : '<i class="sw" style="background:' + i.c + '"></i>') + i.k + '</span>';
    }).join('') + '</div>';
  }
  function empty(msg) { return '<div class="empty">' + (msg || '선택한 조건에 해당하는 데이터가 없습니다') + '</div>'; }
  function el(id) { return document.getElementById(id); }
  function short(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function mno(id) { return String(id).replace(/^.*-(\d+)$/, '$1'); }
  function axis(T, o) {
    return Object.assign({
      axisLine: { lineStyle: { color: T.axis } }, axisTick: { show: false },
      axisLabel: { color: T.muted, fontSize: 11 }, splitLine: { lineStyle: { color: T.grid } }
    }, o || {});
  }
  function bindGo(root, api) {
    api.$$('[data-go]', root).forEach(function (c) {
      c.addEventListener('click', function (e) { if (e.target.closest('.idchip')) return; api.go(c.dataset.go); });
      c.addEventListener('keydown', function (e) { if (e.key === 'Enter') api.go(c.dataset.go); });
    });
  }
  function onClickMeeting(c, api) {
    if (c) c.on('click', function (p) { var id = p.data && (p.data.mid || p.data.id); if (id && /^ML|^[A-Z]+-[A-Z]+-\d+/.test(id)) api.openMeeting(id); else if (id) api.openEntity(id); });
  }
  function pctTxt(v) { return (Math.round(v * 10) / 10) + '%'; }
  function sum(a) { return a.reduce(function (s, v) { return s + v; }, 0); }
  function rate(m) { return m.lowerBetter ? m.target / m.actual * 100 : m.actual / m.target * 100; }
  function kpiState(r) { return r >= 100 ? '달성' : r >= 95 ? '주의' : '미달'; }
  function stateColor(T, s) { return s === '달성' ? T.good : s === '주의' ? T.warning : T.critical; }
  function stateIcon(s) { return s === '달성' ? '✓' : s === '주의' ? '!' : '✕'; }

  // 성과 지표: AI 레이어가 있으면 정규화 지표, 없으면 자동 추출
  function metricsOf(R) {
    var ids = {}; R.meetings.forEach(function (m) { ids[m.id] = true; });
    if (R.ann) return R.ann.metrics.filter(function (x) { return ids[x.m]; }).map(function (x) { var r = rate(x); return Object.assign({ meeting: x.m, rate: r, state: kpiState(r), source: 'ai' }, x); });
    return A.autoMetrics(R.loops).map(function (x) { return Object.assign(x, { m: x.meeting, state: kpiState(x.rate) }); });
  }
  function kpiSeriesOf(R) {
    if (!R.ann) return [];
    var ids = {}; R.meetings.forEach(function (m) { ids[m.id] = true; });
    return R.ann.kpiSeries.map(function (k) {
      var pts = k.points.filter(function (p) { return ids[p.m]; });
      return Object.assign({}, k, { points: pts });
    }).filter(function (k) { return k.points.length; });
  }
  function meetingById(R, id) { return R.all.filter(function (m) { return m.id === id; })[0]; }

  // ---------- 차트 옵션 빌더 ----------
  function timelineOpt(R, api, mini) {
    var T = api.tokens();
    var phases = A.PHASES;
    var ms = R.meetings;
    var series = [{
      type: 'line', data: ms.map(function (m) { return [m.date, phases.indexOf(m.phase)]; }), symbol: 'none', silent: true,
      lineStyle: { color: T.axis, width: 1.5 }, z: 1
    }];
    A.NATURES.forEach(function (n) {
      series.push({
        name: n, type: 'scatter', z: 3,
        symbol: SYM[n], symbolSize: mini ? (n === '긴급' ? 14 : 10) : (n === '긴급' ? 22 : 15),
        itemStyle: { color: api.natureColor(n), borderColor: T.surface, borderWidth: 2 },
        label: mini ? (n === '긴급' ? { show: true, formatter: '!', color: '#fff', fontWeight: 800, fontSize: 9, offset: [0, 2] } : { show: false }) : {
          show: true, formatter: function (p) { return n === '긴급' ? '!' : ''; }, color: '#fff', fontWeight: 800, fontSize: 11, offset: [0, 3]
        },
        data: ms.filter(function (m) { return m.nature === n; }).map(function (m) {
          return { value: [m.date, phases.indexOf(m.phase)], mid: m.id, name: m.title, m: m };
        })
      });
    });
    if (!mini) {
      series.push({
        type: 'scatter', symbolSize: 1, silent: true, itemStyle: { color: 'transparent' },
        label: { show: true, position: 'top', distance: 12, formatter: function (p) { return p.data.no; }, color: T.ink2, fontSize: 10.5, fontWeight: 700 },
        data: ms.map(function (m) { return { value: [m.date, phases.indexOf(m.phase)], no: mno(m.id) }; })
      });
    }
    return {
      grid: { left: mini ? 78 : 96, right: 18, top: mini ? 8 : 24, bottom: 24 },
      tooltip: {
        trigger: 'item', formatter: function (p) {
          var m = p.data && p.data.m; if (!m) return '';
          return '<b>' + api.esc(m.id) + '</b> · ' + api.NATURE_GLYPH[m.nature] + ' ' + m.nature + '<br>' + api.esc(m.title) + '<br><span style="color:' + T.muted + '">' + m.date + ' · ' + api.esc(m.stage) + ' · 결정 ' + m.decisions.length + ' · 업무 ' + m.actions.length + '</span>';
        }
      },
      xAxis: axis(T, { type: 'time', splitLine: { show: false }, axisLabel: { color: T.muted, fontSize: 10.5, formatter: '{yy}.{MM}' } }),
      yAxis: axis(T, { type: 'category', data: phases, inverse: true, axisLabel: { color: T.ink2, fontSize: mini ? 10 : 11.5 }, splitLine: { show: true, lineStyle: { color: T.grid } } }),
      series: series
    };
  }

  function donutOpt(api, items, center, sub) {
    var T = api.tokens();
    return {

  function discussion(p, R, api) {

    var recurring = R.issues.filter(function (i) { return i.mentions >= 2; }).sort(function (a, b) { return b.mentions - a.mentions; });
    var pairs = Object.keys(R.conflictPairs).map(function (k) { return { k: k.split('|'), v: R.conflictPairs[k] }; }).sort(function (a, b) { return b.v - a.v; });

      tile('보류·연기된 논의', ds.filter(function (d) { return d.resolution === '보류·연기'; }).length, '건', '결론 유형 AI 분류') + '</div>';
    h += '<div class="grid">';

    h += card('c7', '단계별 논의 주제 변화 ' + ai(), '진할수록 해당 단계에서 많이 논의됨 (주제 점유율 %)', ch('dTopicPhase', 'h320'));
    h += card('c7', '주요 키워드 ' + ai(), '원문 전체에서 등장 빈도 · 크기 = 언급 수', ch('dKw', 'h360'));

    h += card('c12', '안건별 논의 · 이견 · 결론', '',
      '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>회의</th><th>안건</th><th>주제</th><th>관련 부서</th><th>핵심 논의</th><th>이견·대안</th><th>결론</th><th>결론 방식</th></tr></thead><tbody>' +
      ds.map(function (d) {
        return '<tr><td>' + api.chips(d.meeting) + '</td><td><b>' + api.esc(d.topic) + '</b></td><td><span class="pill">' + d.category + '</span></td><td>' + d.depts.map(function (x) { return A.DEPT_SHORT[x] || x; }).join(', ') + '</td>' +

      }).join('') + '</tbody></table></div>');
    h += '</div>';
    p.innerHTML = h;
    api.bindChips(p);

    api.chart(el('dTopic'), hbarOpt(api, R.topicShare.map(function (t) { return t.key; }), R.topicShare.map(function (t) { return t.pct; }), { unit: '%', left: 96, color: T.s[0], bg: true, barWidth: 14 }));

  function decisionGraphOpt(R, api, links) {
    var T = api.tokens();
    var ids = api.uniq([].concat.apply([], links.map(function (l) { return [l.from, l.to]; })));
    // 연결 요소별로 행 배치
    var parent = {}; ids.forEach(function (i) { parent[i] = i; });
    function find(x) { return parent[x] === x ? x : (parent[x] = find(parent[x])); }
    links.forEach(function (l) { parent[find(l.from)] = find(l.to); });
    var groups = {}; ids.forEach(function (i) { var r = find(i); (groups[r] = groups[r] || []).push(i); });
    var gl = Object.keys(groups).map(function (k) { return groups[k]; });
    var dmap = {}; R.decisions.forEach(function (d) { dmap[d.id] = d; });
    gl.sort(function (a, b) { return Math.min.apply(null, a.map(function (i) { return dmap[i].meetingNo; })) - Math.min.apply(null, b.map(function (i) { return dmap[i].meetingNo; })); });
    var nodes = [];
    gl.forEach(function (g, row) {
      var used = {};
      g.sort().forEach(function (id) {
        var d = dmap[id]; var k = d.meetingNo; used[k] = (used[k] || 0) + 1;
        nodes.push({ name: id, d: d, x: d.meetingNo * 60 + (used[k] - 1) * 26, y: row * 40 + (used[k] - 1) * 16, symbolSize: 14,
          itemStyle: { color: api.decisionColor(d.status), borderColor: T.surface, borderWidth: 2 } });
      });
    });
    return {
      _rows: gl.length,
      tooltip: {
        formatter: function (p) {
          if (p.dataType === 'edge') return '<b style="color:' + linkColor(T, p.data.type) + '">' + p.data.type + '</b> ' + p.data.source + ' → ' + p.data.target + '<br>' + api.esc(p.data.note || '');
          var d = p.data.d; return '<b>' + d.id + '</b> · ' + d.statusRaw + ' · ' + d.meeting + '<br>' + api.esc(d.text);
        }
      },
      series: [{
        type: 'graph', layout: 'none', roam: false, left: 40, right: 60, top: 56, bottom: 20,
        edgeSymbol: ['none', 'arrow'], edgeSymbolSize: 7,
        label: { show: true, position: 'top', fontSize: 10.5, color: T.ink2, fontWeight: 600, formatter: '{b}' },
        data: nodes,
        links: links.map(function (l) { return { source: l.from, target: l.to, type: l.type, note: l.note, lineStyle: { color: linkColor(T, l.type), width: l.type === '번복' ? 3 : 1.8, curveness: 0.12, opacity: 0.9 } }; }),
        emphasis: { focus: 'adjacency' }
      }]
    };
  }

  // 규칙 기반 자동 인사이트 (필터·업로드 데이터에 반응)
  function autoInsights(R, api) {

    var rec = R.issues.filter(function (i) { return i.mentions >= 3; });

    h += card('c6', '예상 리스크 매트릭스 ' + ai(), '발생 가능성 × 영향도 (1–5, AI 추정) · 오른쪽 위일수록 우선 대응', ch('nRisk', 'h320'));
    h += card('c6', '우선 추진과제', '원문의 차년도 착수 업무와 승인 결정', '<div class="prio">' + ny.priorities.slice().sort(function (a, b) { return a.due.localeCompare(b.due); }).map(function (x, i) {

<script>
/*
 * 회의록 분석 대시보드 - 앱 코어
 * 상태·필터 바·탭·상세 드로어·업로드를 담당하고, 각 탭 화면은 views.js 가 그린다.
 */
(function () {
  'use strict';
  var A = window.MeetingAnalytics;
  var STORE_KEY = 'meeting-dashboard:v1';

  // ---------- 상태 ----------
  var S = {
    base: tag(clone((window.BASE_DATA || {}).meetings || []), 'base'),
    uploaded: [],
    includeBase: true,
    tab: 'overview',
    f: emptyFilters(),
    R: null,
    all: []
  };
  function emptyFilters() {
    return { from: '', to: '', nature: [], types: [], phases: [], depts: [], people: [], meetings: [], q: '', source: [] };
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function tag(ms, src) { ms.forEach(function (m) { m.source = src; }); return ms; }

  function store(fn) { try { return fn(window.localStorage); } catch (e) { return null; } }
  store(function (ls) {
    var saved = JSON.parse(ls.getItem(STORE_KEY) || 'null');
    if (saved) {
      S.uploaded = tag(saved.uploaded || [], 'upload');
      S.includeBase = saved.includeBase !== false;
      if (saved.tab) S.tab = saved.tab;
      if (saved.theme) document.documentElement.setAttribute('data-theme', saved.theme);
    }
  });
  function persist() {
    store(function (ls) {
      ls.setItem(STORE_KEY, JSON.stringify({ uploaded: S.uploaded, includeBase: S.includeBase, tab: S.tab, theme: document.documentElement.getAttribute('data-theme') || '' }));
    });
  }

  // ---------- 유틸 ----------
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function $(sel, el) { return (el || document).querySelector(sel); }
  function $$(sel, el) { return Array.prototype.slice.call((el || document).querySelectorAll(sel)); }
  function fmt(n, d) {
    if (n == null || isNaN(n)) return '-';
    return Number(n).toLocaleString('ko-KR', { maximumFractionDigits: d == null ? 1 : d });

      if (c._b) return; c._b = true;
      c.addEventListener('click', function (e) { e.stopPropagation(); openEntity(c.dataset.id); });
      c.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openEntity(c.dataset.id); } });
    });
  }

  // 상태 알약
  var EVAL_COLOR = { '초과': 'goodInk', '달성': 'good', '달성(주의)': 'warning', '부분달성': 'warning', '혼합': 'serious', '미달': 'critical' };
  function evalColor(k) { var T = tokens(); return T[EVAL_COLOR[k]] || T.neutral; }
  function evalPill(k, raw) { return '<span class="st"><i style="background:' + evalColor(k) + '"></i>' + esc(raw || k) + '</span>'; }
  var DEC_COLOR = { '확정': 0, '조건부': 2, '잠정': 3 };
  function decisionColor(k) { var T = tokens(); return k in DEC_COLOR ? T.s[DEC_COLOR[k]] : T.neutral; }
  function decisionPill(k, raw) { return '<span class="st"><i style="background:' + decisionColor(k) + '"></i>' + esc(raw || k) + '</span>'; }
  function actionColor(k) { var T = tokens(); return { '완료': T.good, '부분완료': T.warning, '진행중': T.s[0], '미착수': T.neutral }[k] || T.neutral; }
  function actionPill(k, delayed) {
    return '<span class="st"><i style="background:' + actionColor(k) + '"></i>' + esc(k) + '</span>' + (delayed ? '<span class="st" style="color:var(--critical-ink)">⚠ 지연</span>' : '');
  }

  // ---------- 업로드 ----------
  var PDFJS_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs';
  var PDFJS_WORKER = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';
  var pdfjsPromise = null;
  function loadPdfjs() {
    if (!pdfjsPromise) {
      // 다른 출처의 워커는 pdf.js 가 blob 래퍼로 띄우고, 실패하면 메인 스레드(fake worker)로 자동 전환한다
      pdfjsPromise = import(PDFJS_URL).then(function (lib) {
        lib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
        return lib;
      });
      pdfjsPromise.catch(function () { pdfjsPromise = null; });
    }
    return pdfjsPromise;
  }

  function openModal() { $('#modalBg').classList.add('open'); renderUploadedList(); $('#drop').focus(); }
  function closeModal() { $('#modalBg').classList.remove('open'); }
  function log(msg, cls) { var d = document.createElement('div'); d.className = cls || ''; d.textContent = msg; $('#upLog').appendChild(d); }

  function renderUploadedList() {
    var el = $('#uploadedList');
    if (!S.uploaded.length) { el.innerHTML = '<span class="note">업로드한 회의록이 없습니다.</span>'; return; }
    el.innerHTML = '<b>업로드한 회의록 ' + S.uploaded.length + '건</b>' + S.uploaded.map(function (m) {
      return '<div><span>' + esc(m.id) + ' · ' + esc(m.title) + '</span><span class="note">' + esc(m.date) + '</span></div>';
    }).join('') + '<label style="display:flex;gap:6px;margin-top:8px"><input type="checkbox" id="incBase"' + (S.includeBase ? ' checked' : '') + '> 원본 회의록(기본 데이터)도 함께 보기</label>';
    $('#incBase').addEventListener('change', function (e) { S.includeBase = e.target.checked; persist(); fullRefresh(); });
  }

  function handleFiles(files) {
    files = Array.prototype.slice.call(files || []);
    if (!files.length) return;
    $('#upLog').innerHTML = '';
    var mode = ($('input[name="upMode"]:checked') || {}).value || 'add';
    var added = [];
    var seq = Promise.resolve();
    files.forEach(function (file) {
      seq = seq.then(function () {
        log('처리 중: ' + file.name);
        if (/\.json$/i.test(file.name) || file.type === 'application/json') {
          return file.text().then(function (t) {
            var j = JSON.parse(t);
            var ms = Array.isArray(j) ? j : (j.meetings || []);
            if (!ms.length || !ms[0].id) throw new Error('회의 배열을 찾지 못했습니다');
            added = added.concat(ms); log('✓ ' + file.name + ': 회의 ' + ms.length + '건', 'ok');
          });
        }
        return loadPdfjs().then(function (lib) {
          return file.arrayBuffer().then(function (buf) { return window.MeetingParser.parsePdf(lib, new Uint8Array(buf)); });
        }).then(function (ms) {
          if (!ms.length) throw new Error('표준 양식의 회의 블록(회의번호 | 단계)을 찾지 못했습니다');
          added = added.concat(ms);
          var d = ms.reduce(function (s, m) { return s + m.decisions.length; }, 0), a = ms.reduce(function (s, m) { return s + m.actions.length; }, 0);
          log('✓ ' + file.name + ': 회의 ' + ms.length + '건 · 결정 ' + d + ' · 업무 ' + a + ' 추출', 'ok');
        });
      }).catch(function (e) { log('✕ ' + file.name + ': ' + (e && e.message || e), 'err'); });
    });
    seq.then(function () {
      if (!added.length) return;
      tag(added, 'upload');
      var map = {};
      if (mode === 'add') S.uploaded.forEach(function (m) { map[m.id] = m; });
      added.forEach(function (m) { map[m.id] = m; });
      S.uploaded = Object.keys(map).map(function (k) { return map[k]; });
      if (mode === 'replace') S.includeBase = false;
      persist();
      S.f = emptyFilters();
      fullRefresh();
      renderUploadedList();
      toast('회의록 ' + added.length + '건을 분석해 반영했습니다');
    });
  }

  $('#btnUpload').addEventListener('click', openModal);
  $('#btnCloseModal').addEventListener('click', closeModal);
  $('#modalBg').addEventListener('click', function (e) { if (e.target === $('#modalBg')) closeModal(); });
  $('#fileIn').addEventListener('change', function (e) { handleFiles(e.target.files); e.target.value = ''; });
  var drop = $('#drop');
  drop.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#fileIn').click(); } });
  ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
  drop.addEventListener('drop', function (e) { handleFiles(e.dataTransfer.files); });
  $('#btnClearUploads').addEventListener('click', function () {
    if (!S.uploaded.length) return;
    if (!window.confirm('업로드한 회의록 ' + S.uploaded.length + '건을 대시보드에서 삭제할까요?')) return;
    S.uploaded = []; S.includeBase = true; persist(); S.f = emptyFilters(); fullRefresh(); renderUploadedList(); toast('업로드 데이터를 삭제했습니다');
  });

  $('#btnExport').addEventListener('click', function () {
    var data = { exportedAt: new Date().toISOString(), meetings: dataset().map(function (m) {
      var c = clone(m); delete c.sections; return c;
    }) };
    var blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'meetings-structured.json'; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  });

  $('#btnTheme').addEventListener('click', function () {
    var cur = tokens().dark ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
    persist(); renderPanel();
  });
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', function () { if (!document.documentElement.getAttribute('data-theme')) renderPanel(); });
  }

  // ---------- 새로 고침 ----------
  function header() {
    var base = S.includeBase ? S.base.length : 0;
    $('#datasetPill').innerHTML = '<span class="dot" style="background:var(--s1)"></span>원본 ' + base + '건' +
      (S.uploaded.length ? ' · <span class="dot" style="background:var(--s2)"></span>업로드 ' + S.uploaded.length + '건' : '');
    var first = S.all[0], last = S.all[S.all.length - 1];
    var proj = S.includeBase && window.BASE_DATA ? 'MOMENT LAB · MOMENT OAT LATTE 신제품 런칭 프로젝트' : '업로드한 회의록';
    $('#projectLine').textContent = proj + (first ? ' · ' + first.date.replace(/-/g, '.') + ' – ' + last.date.replace(/-/g, '.') : '');
  }
  function refresh(keepBar) {
    recompute();
    if (!keepBar) renderFilterBar(); else updateFilterStatus();
    renderPanel();
  }
  function fullRefresh() { recompute(); header(); renderFilterBar(); renderPanel(); }

  // 뷰에서 쓰는 공용 API
  var API = {
    S: S, A: A, esc: esc, fmt: fmt, chart: chart, tokens: tokens, go: go, openMeeting: openMeeting, openEntity: openEntity,
    chips: chips, bindChips: bindChips, evalColor: evalColor, evalPill: evalPill, decisionColor: decisionColor, decisionPill: decisionPill,
    actionColor: actionColor, actionPill: actionPill, natureColor: natureColor, NATURE_GLYPH: NATURE_GLYPH, uniq: uniq, $: $, $$: $$,
    setFilter: function (k, v) { S.f = emptyFilters(); if (Array.isArray(S.f[k])) S.f[k] = [].concat(v); else S.f[k] = v; refresh(); },
    toast: toast
  };
  window.DashboardAPI = API;

  // 시작
  fullRefresh();
  renderTabs();
  go(S.tab);
})();

</script>
</body>
</html>
