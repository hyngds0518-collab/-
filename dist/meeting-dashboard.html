<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회의록 분석 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 회의록 분석 대시보드 — 라이트 SaaS 톤 (사이드바 · 흰 카드 · 파스텔 아이콘) */
:root {
  color-scheme: light;
  --page: #f4f6fb;
  --surface: #ffffff;
  --surface-2: #f7f8fc;
  --surface-3: #eef1f7;
  --ink: #0f172a;
  --ink-2: #5b6474;
  --muted: #98a1b2;
  --grid: #eef1f6;
  --axis: #dfe3eb;
  --border: #eceff5;
  --border-strong: #dfe3ec;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.03), 0 6px 20px rgba(16, 24, 40, 0.04);
  --shadow-lg: 0 20px 48px rgba(16, 24, 40, 0.14);
  --accent: #2563eb;
  --accent-2: #1d4ed8;
  --accent-soft: #eaf1ff;
  --accent-ink: #1e40af;
  --s1: #2563eb; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6d4ee6; --s8: #e34948;
  --good: #16a34a; --warning: #f5a524; --serious: #ef8354; --critical: #e5484d;
  --good-ink: #15803d; --critical-ink: #c53030;
  --neutral: #c5cad6;
  --seq-1: #dbe8ff; --seq-2: #b5cffc; --seq-3: #86b0f8; --seq-4: #5690f2; --seq-5: #2f6fe8; --seq-6: #1f55c4; --seq-7: #173f93;
  /* 파스텔 톤 (아이콘 배경 / 전경) */
  --t-blue-bg: #eaf1ff; --t-blue: #2563eb;
  --t-green-bg: #e6f7ee; --t-green: #16a34a;
  --t-purple-bg: #f0ebff; --t-purple: #7c4dff;
  --t-orange-bg: #fff1e6; --t-orange: #f07a22;
  --t-pink-bg: #fdecf1; --t-pink: #e0457b;
  --t-teal-bg: #e3f7f7; --t-teal: #0e9f9a;
  --t-amber-bg: #fff6dd; --t-amber: #d98e04;
  --t-red-bg: #fdecec; --t-red: #e5484d;
  --t-slate-bg: #eef1f6; --t-slate: #475569;
  --radius: 16px;
  --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --side-w: 244px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0b0f17; --surface: #141a24; --surface-2: #19202c; --surface-3: #212a38;
    --ink: #f3f5f9; --ink-2: #aab3c3; --muted: #6e788a; --grid: #1f2733; --axis: #2b3544;
    --border: #222b39; --border-strong: #2d3848; --shadow: none; --shadow-lg: 0 20px 48px rgba(0,0,0,.5);
    --accent: #4f8bff; --accent-2: #6b9dff; --accent-soft: #17243d; --accent-ink: #9dbdff;
    --s1: #4f8bff; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    --good-ink: #34c46a; --critical-ink: #ff7b7f; --neutral: #4b5566;
    --seq-1: #132a52; --seq-2: #173a74; --seq-3: #1f4c98; --seq-4: #2a62c2; --seq-5: #4f8bff; --seq-6: #86adff; --seq-7: #b9d0ff;
    --t-blue-bg: #17243d; --t-blue: #7aa7ff; --t-green-bg: #13291f; --t-green: #4ccf7f; --t-purple-bg: #221c3d; --t-purple: #a98bff;
    --t-orange-bg: #33210f; --t-orange: #ff9e57; --t-pink-bg: #331826; --t-pink: #ff7fae; --t-teal-bg: #0f2c2c; --t-teal: #3fd0c9;
    --t-amber-bg: #2f260d; --t-amber: #f2bb3c; --t-red-bg: #351617; --t-red: #ff7b7f; --t-slate-bg: #202837; --t-slate: #b3bdcd;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0b0f17; --surface: #141a24; --surface-2: #19202c; --surface-3: #212a38;
  --ink: #f3f5f9; --ink-2: #aab3c3; --muted: #6e788a; --grid: #1f2733; --axis: #2b3544;
  --border: #222b39; --border-strong: #2d3848; --shadow: none; --shadow-lg: 0 20px 48px rgba(0,0,0,.5);
  --accent: #4f8bff; --accent-2: #6b9dff; --accent-soft: #17243d; --accent-ink: #9dbdff;
  --s1: #4f8bff; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  --good-ink: #34c46a; --critical-ink: #ff7b7f; --neutral: #4b5566;
  --seq-1: #132a52; --seq-2: #173a74; --seq-3: #1f4c98; --seq-4: #2a62c2; --seq-5: #4f8bff; --seq-6: #86adff; --seq-7: #b9d0ff;
  --t-blue-bg: #17243d; --t-blue: #7aa7ff; --t-green-bg: #13291f; --t-green: #4ccf7f; --t-purple-bg: #221c3d; --t-purple: #a98bff;
  --t-orange-bg: #33210f; --t-orange: #ff9e57; --t-pink-bg: #331826; --t-pink: #ff7fae; --t-teal-bg: #0f2c2c; --t-teal: #3fd0c9;
  --t-amber-bg: #2f260d; --t-amber: #f2bb3c; --t-red-bg: #351617; --t-red: #ff7b7f; --t-slate-bg: #202837; --t-slate: #b3bdcd;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page); color: var(--ink); font-family: var(--font);
  font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; letter-spacing: -0.005em;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ic { flex: none; display: block; }

/* 톤 */
.tone-blue { background: var(--t-blue-bg); color: var(--t-blue); } .tone-green { background: var(--t-green-bg); color: var(--t-green); }
.tone-purple { background: var(--t-purple-bg); color: var(--t-purple); } .tone-orange { background: var(--t-orange-bg); color: var(--t-orange); }
.tone-pink { background: var(--t-pink-bg); color: var(--t-pink); } .tone-teal { background: var(--t-teal-bg); color: var(--t-teal); }
.tone-amber { background: var(--t-amber-bg); color: var(--t-amber); } .tone-red { background: var(--t-red-bg); color: var(--t-red); }
.tone-slate { background: var(--t-slate-bg); color: var(--t-slate); }
.ic-wrap { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.ic-wrap.sq { border-radius: 12px; }
.ic-wrap.sm { width: 34px; height: 34px; }
.ic-wrap.lg { width: 52px; height: 52px; }

/* ---------- 앱 레이아웃 ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; background: linear-gradient(to right, var(--surface) calc(var(--side-w) - 1px), var(--border) calc(var(--side-w) - 1px), var(--border) var(--side-w), transparent var(--side-w)); }
.sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--border);
  padding: 22px 16px 18px; display: flex; flex-direction: column; gap: 22px; scrollbar-width: thin;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand-mark { width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 14px rgba(37, 99, 235, .3); }
.brand-txt b { display: block; font-size: 18px; letter-spacing: -0.02em; color: var(--ink); line-height: 1.1; }
.brand-txt b span { color: var(--accent); }
.brand-txt small { font-size: 11.5px; color: var(--muted); font-weight: 600; letter-spacing: .08em; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav .tab {
  display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 9px 12px; border-radius: 10px; border: 0;
  background: none; color: var(--ink-2); font-weight: 600; font-size: 13.5px; white-space: nowrap;
}
.nav .tab:hover { background: var(--surface-2); color: var(--ink); }
.nav .tab[aria-selected="true"] { background: var(--accent); color: #fff; box-shadow: 0 6px 14px rgba(37, 99, 235, .28); }
.nav .tab .ic { width: 18px; height: 18px; }
.nav .tab .cnt { margin-left: auto; font-size: 11px; font-weight: 700; background: var(--accent); color: #fff; border-radius: 999px; min-width: 20px; height: 20px; display: grid; place-items: center; padding: 0 6px; }
.nav .tab[aria-selected="true"] .cnt { background: rgba(255,255,255,.25); }
.nav-sep { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .06em; padding: 12px 12px 4px; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 12px; }
.side-help { display: flex; gap: 10px; align-items: center; border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
.side-help b { font-size: 13px; display: block; }
.side-help small { font-size: 11.5px; color: var(--ink-2); }
.side-promo { background: linear-gradient(160deg, var(--t-blue-bg), var(--surface-2)); border-radius: 16px; padding: 16px; text-align: left; }
.side-promo .promo-art { height: 62px; display: grid; place-items: center; margin-bottom: 8px; color: var(--t-green); }
.side-promo b { font-size: 13px; display: block; }
.side-promo p { margin: 3px 0 0; font-size: 12px; color: var(--ink-2); }

.shell { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 16px; padding: 20px 28px 12px; flex-wrap: wrap; }
.page-title { flex: 1 1 260px; min-width: 0; }
.page-title h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; font-weight: 800; }
.page-title p { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search {
  display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; width: 300px; color: var(--muted); box-shadow: var(--shadow);
}
.search input { border: 0; outline: 0; background: none; width: 100%; font-size: 13px; color: var(--ink); }
.search:focus-within { border-color: var(--accent); }
.top-actions { display: flex; align-items: center; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 16px; border-radius: 11px;
  border: 1px solid var(--border); background: var(--surface); font-weight: 700; font-size: 13px; white-space: nowrap; box-shadow: var(--shadow);
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: #fff; border-color: transparent; box-shadow: 0 6px 14px rgba(37, 99, 235, .28); }
.btn.primary:hover { background: var(--accent-2); }
.btn.ghost { box-shadow: none; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 12.5px; border-radius: 9px; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; color: var(--ink-2); box-shadow: var(--shadow); }
.icon-btn:hover { color: var(--ink); background: var(--surface-2); }
.me { display: flex; align-items: center; gap: 10px; padding-left: 6px; }
.me-av { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #1e293b, #475569); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 800; }
.me b { display: block; font-size: 13px; line-height: 1.2; }
.me small { font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; vertical-align: middle; margin-right: 3px; }

/* ---------- 필터 바 ---------- */
.filter-wrap { position: sticky; top: 0; z-index: 30; padding: 6px 28px 10px; background: color-mix(in srgb, var(--page) 88%, transparent); backdrop-filter: blur(10px); }
.filter-bar {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 8px 10px; box-shadow: var(--shadow);
}
.filter-label { font-size: 11.5px; color: var(--muted); font-weight: 700; margin: 0 2px 0 6px; }
.fgroup { display: inline-flex; align-items: center; gap: 4px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.chip {
  height: 30px; padding: 0 12px; border-radius: 8px; border: 0; background: transparent; color: var(--ink-2);
  font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgba(16,24,40,.1); }
.chip .glyph { font-size: 11px; line-height: 1; }
.fsep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }
.dd { position: relative; }
.dd-btn { height: 34px; padding: 0 10px 0 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); font-size: 12.5px; font-weight: 600; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.dd-btn:hover { color: var(--ink); border-color: var(--border-strong); }
.dd-btn .count { background: var(--accent); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 6px; line-height: 17px; }
.dd-btn svg { width: 14px; height: 14px; color: var(--muted); }
.dd-panel {
  position: absolute; top: calc(100% + 6px); left: 0; min-width: 250px; max-height: 360px; overflow: auto; z-index: 40;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 6px;
}
.dd-panel label { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 8px; font-size: 13px; cursor: pointer; }
.dd-panel label:hover { background: var(--surface-2); }
.dd-panel input { accent-color: var(--accent); }
.dd-panel .dd-foot { display: flex; justify-content: space-between; padding: 6px 8px 2px; border-top: 1px solid var(--border); margin-top: 4px; }
.dd-panel .dd-foot button { background: none; border: 0; color: var(--accent); font-size: 12px; font-weight: 700; }
.date-range { display: inline-flex; align-items: center; gap: 6px; height: 34px; border: 1px solid var(--border); border-radius: 9px; padding: 0 8px 0 10px; color: var(--ink-2); }
.date-in { width: 118px; height: 30px; border: 0; background: transparent; font-size: 12.5px; font-weight: 600; color: var(--ink); }
.filter-status { margin-left: auto; font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 10px; padding-right: 4px; }
.filter-status b { color: var(--accent); font-size: 14px; }
.link-btn { background: none; border: 0; color: var(--accent); font-weight: 700; font-size: 12.5px; padding: 0; }
.sel-banner { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); color: var(--accent-ink); border-radius: 8px; padding: 4px 8px; font-size: 12px; font-weight: 700; }

main { padding: 8px 28px 64px; }
.panel { display: none; }
.panel.active { display: block; }
.panel-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 6px 0 14px; flex-wrap: wrap; }
.panel-head h2 { margin: 0; font-size: 17px; letter-spacing: -0.015em; font-weight: 800; }
.panel-head p { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }

/* ---------- 그리드·카드 ---------- */
.grid { display: grid; gap: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; }
.c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c9 { grid-column: span 9; } .c12 { grid-column: span 12; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 18px 14px;
  box-shadow: var(--shadow); min-width: 0; display: flex; flex-direction: column;
}
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.card-title { font-size: 14.5px; font-weight: 800; margin: 0; display: flex; align-items: center; gap: 7px; letter-spacing: -0.01em; }
.card-sub { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
.card-tools { display: flex; gap: 6px; align-items: center; flex: none; }
.view-all { background: none; border: 0; color: var(--accent); font-weight: 700; font-size: 12.5px; padding: 2px 0; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.view-all:hover { text-decoration: underline; }
.mini-btn { height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; font-weight: 600; color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; }
.mini-btn:hover { background: var(--surface-2); }
.mini-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chart { width: 100%; min-height: 160px; height: 280px; flex: none; }
.chart.h160 { height: 160px; } .chart.h200 { height: 200px; } .chart.h240 { height: 240px; } .chart.h280 { height: 280px; }
.chart.h320 { height: 320px; } .chart.h360 { height: 360px; } .chart.h420 { height: 420px; } .chart.h480 { height: 480px; }
.badge-ai { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--t-purple-bg); color: var(--t-purple); white-space: nowrap; }
.badge-src { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.empty { color: var(--muted); font-size: 13px; padding: 28px 8px; text-align: center; }

/* 개요 영역 카드 */
.ov-card { cursor: pointer; transition: box-shadow .15s, transform .15s; }
.ov-card:hover { box-shadow: 0 10px 30px rgba(16, 24, 40, .08); transform: translateY(-1px); }
.ov-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ov-num { font-size: 11.5px; color: var(--accent); font-weight: 800; background: var(--accent-soft); border-radius: 6px; padding: 1px 6px; }
.ov-hero { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 2px 0 4px; }
.ov-hero .big { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
.ov-hero .unit { font-size: 13px; color: var(--ink-2); font-weight: 700; }
.ov-hero .aside { font-size: 12px; color: var(--ink-2); }

/* KPI 스탯 카드 (아이콘 + 값) */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; margin-bottom: 16px; }
.tile {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow);
  display: flex; gap: 14px; align-items: center; min-width: 0;
}
.tile .tb { min-width: 0; }
.tile .k { font-size: 12.5px; color: var(--ink-2); font-weight: 700; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.tile .v { font-size: 25px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.25; }
.tile .v small { font-size: 13px; color: var(--ink-2); font-weight: 700; margin-left: 2px; letter-spacing: 0; }
.tile .d { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .d .up { color: var(--good-ink); font-weight: 700; } .tile .d .dn { color: var(--critical-ink); font-weight: 700; }

/* 상태 표기 */
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.st i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--surface-3); color: var(--ink-2); white-space: nowrap; }
.status { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.idchip {
  display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 6px; font-size: 11.5px; font-weight: 700; white-space: nowrap;
  background: var(--accent-soft); border: 0; color: var(--accent-ink); cursor: pointer; font-variant-numeric: tabular-nums; margin: 1px 2px 1px 0;
}
.idchip:hover { background: var(--accent); color: #fff; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12px; color: var(--ink-2); margin: 2px 0 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.legend .sym { font-size: 12px; line-height: 1; }

/* 표 */
.tbl-wrap { overflow: auto; max-height: 520px; border: 1px solid var(--border); border-radius: 12px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tbl th { position: sticky; top: 0; background: var(--surface-2); text-align: left; font-weight: 700; color: var(--ink-2); padding: 10px 12px; white-space: nowrap; z-index: 1; font-size: 12px; }
.tbl td { padding: 10px 12px; border-top: 1px solid var(--border); vertical-align: top; }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl tr:hover td { background: var(--surface-2); }
.tbl .clip { max-width: 360px; }

/* ---------- 아바타·리스트 ---------- */
.av { width: 44px; height: 44px; border-radius: 50%; flex: none; object-fit: cover; background: var(--surface-3); display: grid; place-items: center; font-size: 13px; font-weight: 800; color: var(--ink-2); }
.av.sm { width: 30px; height: 30px; font-size: 11px; }
.av.xs { width: 24px; height: 24px; font-size: 10px; }
.av.lg { width: 52px; height: 52px; }
.av-stack { display: flex; align-items: center; }
.av-stack .av { border: 2px solid var(--surface); margin-left: -8px; }
.av-stack .av:first-child { margin-left: 0; }
.av-stack .more { margin-left: -8px; width: 24px; height: 24px; border-radius: 50%; background: var(--surface-3); border: 2px solid var(--surface); font-size: 10px; font-weight: 800; color: var(--ink-2); display: grid; place-items: center; }
.plist { display: flex; flex-direction: column; }
.prow { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--border); cursor: pointer; border-radius: 10px; }
.prow:last-child { border-bottom: 0; }
.prow:hover { background: var(--surface-2); }
.prow b { font-size: 13.5px; display: block; line-height: 1.3; }
.prow .role { font-size: 12px; color: var(--ink-2); }
.prow .meta { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.prow .meta em { font-style: normal; color: var(--good-ink); font-weight: 800; margin-left: 4px; }
.prow .right { text-align: right; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.tag-row { display: flex; gap: 4px; flex-wrap: wrap; }

/* 일정(스케줄) 리스트 */
.sched { display: flex; flex-direction: column; }
.srow { display: grid; grid-template-columns: 74px 1fr auto; gap: 14px; align-items: center; padding: 12px 6px; border-bottom: 1px solid var(--border); cursor: pointer; border-radius: 10px; position: relative; }
.srow:last-child { border-bottom: 0; }
.srow:hover { background: var(--surface-2); }
.srow.active { background: var(--accent-soft); }
.srow .when { font-size: 12px; color: var(--ink-2); font-weight: 600; line-height: 1.35; font-variant-numeric: tabular-nums; }
.srow .when b { display: block; color: var(--ink); font-size: 13px; }
.srow .body { min-width: 0; border-left: 2px solid var(--border); padding-left: 12px; }
.srow .body b { font-size: 13.5px; display: block; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; }
.srow .body small { font-size: 12px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 3px; }
.srow .right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.srow.n-긴급 .body { border-left-color: var(--critical); } .srow.n-임시 .body { border-left-color: var(--t-orange); } .srow.n-정기 .body { border-left-color: var(--t-blue); }
.st-정기 { background: var(--t-blue-bg); color: var(--t-blue); } .st-임시 { background: var(--t-orange-bg); color: var(--t-orange); }
.st-긴급 { background: var(--t-red-bg); color: var(--t-red); } .st-done { background: var(--t-green-bg); color: var(--t-green); }

/* ---------- 캘린더 ---------- */
.cal-wrap { display: flex; flex-direction: column-reverse; gap: 14px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin: 2px 0 10px; }
.cal-head b { font-size: 15px; font-weight: 800; }
.cal-nav { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-2); display: grid; place-items: center; }
.cal-nav:hover { color: var(--accent); border-color: var(--accent); }
.cal-nav:disabled { opacity: .35; cursor: default; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dow { font-size: 11.5px; color: var(--muted); font-weight: 700; text-align: center; padding: 2px 0 6px; }
.cal .dow.sun { color: var(--t-red); } .cal .dow.sat { color: var(--t-blue); }
.day {
  min-height: 70px; border-radius: 10px; padding: 5px 5px 4px; border: 1px solid transparent; background: transparent; text-align: left;
  display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; color: var(--ink); min-width: 0; cursor: default;
}
.day .n { font-weight: 700; font-size: 12.5px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.day.out { color: var(--muted); opacity: .45; }
.day.has { background: var(--surface-2); cursor: pointer; border-color: var(--border); }
.day.has:hover { border-color: var(--accent); }
.day.sel { background: var(--accent-soft); border-color: var(--accent); }
.day.sel .n { background: var(--accent); color: #fff; }
.day.dim { opacity: .5; }
.ev {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 10.5px; font-weight: 700; line-height: 1.3; padding: 2px 5px; border-radius: 5px; overflow: hidden; word-break: keep-all;
  background: var(--t-blue-bg); color: var(--t-blue);
}
.ev.n-임시 { background: var(--t-orange-bg); color: var(--t-orange); }
.ev.n-긴급 { background: var(--t-red-bg); color: var(--t-red); }
.cal-side { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 10px; align-items: center; }
.cs { border-radius: 14px; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.cs small { font-size: 12px; font-weight: 700; display: block; color: var(--ink-2); }
.cs b { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); }
.cs .ic-wrap { width: 36px; height: 36px; border-radius: 10px; color: #fff; }
.cs.blue { background: var(--t-blue-bg); } .cs.blue .ic-wrap { background: var(--t-blue); }
.cs.green { background: var(--t-green-bg); } .cs.green .ic-wrap { background: var(--t-green); }
.cs.orange { background: var(--t-orange-bg); } .cs.orange .ic-wrap { background: var(--t-orange); }
.cal-legend { display: flex; gap: 12px; font-size: 11.5px; color: var(--ink-2); margin-top: 10px; flex-wrap: wrap; }
.cal-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 5px; vertical-align: -1px; }

/* 선택 회의 · 회의록 펼침 */
.sel-card .sel-top { display: flex; gap: 12px; align-items: flex-start; }
.sel-card h4 { margin: 0; font-size: 16px; line-height: 1.4; letter-spacing: -0.01em; }
.sel-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 12px 0; }
.sel-meta div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; font-size: 12px; color: var(--ink-2); min-width: 0; }
.sel-meta b { display: block; color: var(--ink); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sel-counts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
.sel-counts div { text-align: center; border: 1px solid var(--border); border-radius: 10px; padding: 8px 4px; }
.sel-counts b { display: block; font-size: 18px; font-weight: 800; }
.sel-counts small { font-size: 11px; color: var(--ink-2); font-weight: 600; }
.minutes { margin-top: 16px; border: 1px solid var(--accent); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; animation: fadeIn .2s ease; }
.minutes-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 20px; background: var(--accent-soft); flex-wrap: wrap; }
.minutes-head h3 { margin: 0; font-size: 16px; }
.minutes-head .sub { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.minutes-body { padding: 16px 20px 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px; }
.minutes-body .dsec.wide { grid-column: 1 / -1; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

/* 부서 요약 카드 */
.dept-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 12px; }
.dcard { border: 1px solid var(--border); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; background: var(--surface); }
.dcard:hover { border-color: var(--accent); }
.dcard .nm { font-size: 13px; font-weight: 700; }
.dcard .val { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
.dcard .ft { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 2px 6px; font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }
.dcard .ft em { font-style: normal; color: var(--good-ink); font-weight: 700; }

/* 하단 통계 스트립 */
.strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; background: linear-gradient(180deg, var(--t-blue-bg), var(--surface-2)); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 8px; margin-top: 16px; }
.strip > div { display: flex; gap: 12px; align-items: center; padding: 4px 14px; border-right: 1px solid var(--border-strong); min-width: 0; }
.strip > div:last-child { border-right: 0; }
.strip .ic-wrap { background: var(--surface); color: var(--accent); border-radius: 12px; box-shadow: var(--shadow); }
.strip small { font-size: 12px; color: var(--accent-ink); font-weight: 700; display: block; }
.strip b { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; display: block; line-height: 1.2; }
.strip span { font-size: 11.5px; color: var(--ink-2); }

/* 회의 카드 그리드 (구) */
.mcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.nature-tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.nature-정기 { background: var(--t-blue-bg); color: var(--t-blue); }
.nature-임시 { background: var(--t-orange-bg); color: var(--t-orange); }
.nature-긴급 { background: var(--t-red-bg); color: var(--t-red); }

/* 인사이트 카드 */
.insights { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.ins { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
.ins .cat { font-size: 12px; font-weight: 700; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
.ins .cat .ic-wrap { width: 32px; height: 32px; border-radius: 10px; }
.ins .cat svg { width: 16px; height: 16px; }
.ins .metric { display: flex; align-items: baseline; gap: 8px; }
.ins .metric b { font-size: 28px; letter-spacing: -0.03em; line-height: 1.1; }
.ins .metric span { font-size: 12px; color: var(--ink-2); }
.ins h4 { margin: 0; font-size: 14.5px; line-height: 1.45; }
.ins p { margin: 0; font-size: 13px; color: var(--ink-2); }
.ins .ev { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; padding-top: 6px; align-items: center; }
.summary-vs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.sv { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; background: var(--surface-2); }
.sv h5 { margin: 0 0 6px; font-size: 12px; color: var(--accent-ink); }
.sv p { margin: 0; font-size: 13px; }

/* 위기 흐름 */
.flow { display: grid; grid-template-columns: 150px repeat(4, minmax(0, 1fr)); gap: 0; align-items: stretch; }
.flow + .flow { margin-top: 12px; }
.flow .lab { display: flex; flex-direction: column; justify-content: center; gap: 4px; padding-right: 10px; }
.flow .lab b { font-size: 13.5px; }
.flow .lab span { font-size: 11.5px; color: var(--ink-2); }
.flow .step { position: relative; background: var(--surface-2); border-radius: 12px; padding: 11px 13px 11px 15px; margin-right: 20px; font-size: 12.5px; border-left: 3px solid var(--c); }
.flow .step:last-child { margin-right: 0; }
.flow .step:not(:last-child)::after {
  content: ""; position: absolute; right: -15px; top: 50%; width: 9px; height: 9px; transform: translateY(-50%) rotate(45deg);
  border-top: 2px solid var(--muted); border-right: 2px solid var(--muted);
}
.flow .step small { display: block; font-size: 10.5px; font-weight: 800; color: var(--muted); margin-bottom: 2px; letter-spacing: .02em; }
.flow-head { display: grid; grid-template-columns: 150px repeat(4, minmax(0, 1fr)); margin-bottom: 6px; font-size: 11.5px; font-weight: 800; color: var(--ink-2); }
.flow-head span { padding-left: 14px; }
.sev { display: inline-flex; gap: 2px; }
.sev i { width: 10px; height: 4px; border-radius: 2px; background: var(--grid); display: inline-block; }
.sev i.on { background: var(--critical); }

/* 차년도 */
.pl-row { display: grid; grid-template-columns: 120px 1fr 1fr 1fr; gap: 0; align-items: stretch; }
.pl-row + .pl-row { margin-top: 10px; }
.pl-head { display: grid; grid-template-columns: 120px 1fr 1fr 1fr; font-size: 11.5px; font-weight: 800; color: var(--ink-2); margin-bottom: 6px; }
.pl-head span { padding-left: 12px; }
.pl-theme { font-size: 13px; font-weight: 800; display: flex; align-items: center; padding-right: 8px; }
.pl-cell { position: relative; padding: 11px 13px; border-radius: 12px; margin-right: 18px; font-size: 12.5px; background: var(--surface-2); }
.pl-cell:last-child { margin-right: 0; }
.pl-cell:not(:last-child)::after { content: "→"; position: absolute; right: -14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 700; }
.pl-cell.p { border-left: 3px solid var(--critical); }
.pl-cell.l { border-left: 3px solid var(--t-amber); }
.pl-cell.n { border-left: 3px solid var(--good); background: var(--t-green-bg); font-weight: 600; }
.pl-cell .ev { margin-top: 5px; }
.matrix { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mq { border-radius: 14px; padding: 14px; border: 1px solid var(--border); background: var(--surface-2); }
.mq h5 { margin: 0 0 8px; font-size: 13.5px; display: flex; align-items: center; gap: 6px; }
.mq ul { margin: 0; padding-left: 18px; font-size: 12.5px; }
.mq li + li { margin-top: 3px; }
.mq.keep { border-top: 3px solid var(--t-blue); } .mq.stop { border-top: 3px solid var(--critical); }
.mq.improve { border-top: 3px solid var(--t-amber); } .mq.new { border-top: 3px solid var(--good); }
.kpt { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.kpt > div { background: var(--surface-2); border-radius: 14px; padding: 14px; }
.kpt h5 { margin: 0 0 6px; font-size: 13.5px; }
.kpt ul { margin: 0; padding-left: 18px; font-size: 12.5px; }
.prio { display: flex; flex-direction: column; gap: 8px; }
.prio-item { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; padding: 11px 13px; border-radius: 12px; background: var(--surface-2); }
.prio-item .n { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.prio-item b { font-size: 13px; display: block; }
.prio-item span { font-size: 11.5px; color: var(--ink-2); }

/* KPI 카드 */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.kpi { border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; background: var(--surface); display: flex; flex-direction: column; gap: 4px; box-shadow: var(--shadow); cursor: pointer; }
.kpi:hover { border-color: var(--border-strong); }
.kpi[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.kpi .name { font-size: 12.5px; font-weight: 700; color: var(--ink-2); display: flex; justify-content: space-between; gap: 6px; }
.kpi .val { font-size: 23px; font-weight: 800; letter-spacing: -0.03em; }
.kpi .val small { font-size: 12px; font-weight: 700; color: var(--ink-2); margin-left: 2px; }
.kpi .row { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-2); gap: 6px; }
.bar { height: 6px; border-radius: 3px; background: var(--grid); position: relative; overflow: visible; margin: 4px 0 2px; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.bar > em { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; }
.delta-up { color: var(--good-ink); font-weight: 700; } .delta-down { color: var(--critical-ink); font-weight: 700; }

/* 드로어 */
.drawer-bg { position: fixed; inset: 0; background: rgba(15, 23, 42, .35); z-index: 60; display: none; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100vw); background: var(--surface); z-index: 61; transform: translateX(100%); transition: transform .22s ease; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); }
.drawer.open { transform: none; }
.drawer-bg.open { display: block; }
.drawer-head { padding: 18px 22px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.drawer-head h3 { margin: 0; font-size: 17px; line-height: 1.4; }
.drawer-head .sub { font-size: 12.5px; color: var(--ink-2); margin-top: 5px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.drawer-body { padding: 16px 22px 40px; overflow: auto; }
.dsec { margin-bottom: 18px; min-width: 0; }
.dsec h4 { margin: 0 0 8px; font-size: 12.5px; color: var(--accent-ink); display: flex; align-items: center; gap: 6px; font-weight: 800; }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); font-weight: 600; }
.kv dd { margin: 0; }
.ditem { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
.ditem + .ditem { margin-top: 6px; }
.ditem .h { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
.ditem p { margin: 2px 0; color: var(--ink-2); font-size: 12.5px; }
.ditem p b { color: var(--ink); font-weight: 700; }
.hl { outline: 2px solid var(--accent); outline-offset: 1px; }
.att-list { display: flex; flex-wrap: wrap; gap: 6px; }
.att { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px 2px 2px; font-size: 12px; }
.att small { color: var(--muted); }

/* 업로드 모달 */
.modal-bg { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); z-index: 70; display: none; align-items: center; justify-content: center; padding: 16px; }
.modal-bg.open { display: flex; }
.modal { width: min(560px, 100%); background: var(--surface); border-radius: 18px; padding: 22px; max-height: 90vh; overflow: auto; box-shadow: var(--shadow-lg); }
.modal h3 { margin: 0 0 4px; font-size: 18px; }
.modal p.desc { margin: 0 0 14px; color: var(--ink-2); font-size: 13px; }
.drop { display: block; border: 2px dashed var(--border-strong); border-radius: 14px; padding: 30px 16px; text-align: center; cursor: pointer; background: var(--surface-2); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop b { display: block; font-size: 14px; margin-bottom: 4px; }
.drop span { font-size: 12.5px; color: var(--ink-2); }
.up-opts { display: flex; gap: 14px; margin: 12px 0; font-size: 13px; flex-wrap: wrap; }
.up-opts input { accent-color: var(--accent); }
.up-log { font-size: 12.5px; margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
.up-log .ok { color: var(--good-ink); } .up-log .err { color: var(--critical-ink); }
.modal-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.uploaded-list { font-size: 12.5px; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
.uploaded-list div { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }

.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--page); padding: 11px 18px; border-radius: 12px; font-size: 13px; z-index: 80; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }

  function lineText(L) { return joinItems(L.its); }

  function colIndex(cols, x) {
    var idx = 0;
    for (var i = 0; i < cols.length; i++) if (x >= cols[i] - 3) idx = i;
    return idx;
  }

  // 여러 줄 셀 텍스트 결합.
  // pdf.js 는 줄 끝 공백을 버리므로, 한국어 어절 경계를 추정해 띄어쓰기를 복원한다.
  var WORD_END = /[는은를을의에며고서로과와및등후해된한할인여만도게면요다됨함음임짐]$/;
  function lineGlue(a, b) {
    if (/[.,;:)\]”’%]$/.test(a)) return ' ';
    if (/^[“‘(\[]/.test(b)) return ' ';
    if (/[A-Za-z0-9]$/.test(a) && /^[가-힣]/.test(b)) return ' ';
    if (/[가-힣]$/.test(a) && /^[A-Za-z0-9]/.test(b)) return ' ';
    if (/[가-힣]$/.test(a) && /^[가-힣]/.test(b) && WORD_END.test(a)) return ' ';
    return '';
  }
  function joinCellLines(parts) {
    var out = '';
    parts.forEach(function (p) {
      p = p.trim();
      if (!p) return;
      out = out ? out + lineGlue(out, p) + p : p;
    });
    return clean(out);
  }

  // 줄을 세그먼트(연속된 글자 묶음)로 나눈다. 열 경계는 큰 공백(>6pt)으로 구분된다.
  function segments(L, cols) {
    var segs = [], cur = null;
    L.its.forEach(function (it) {
      var atCol = cols && cols.some(function (c) { return Math.abs(it.x - c) < 1.5; });
      if (cur && it.x - cur.end < (atCol ? 2 : 6)) { cur.its.push(it); cur.end = it.x + (it.w || 0); }
      else { cur = { x: it.x, end: it.x + (it.w || 0), its: [it] }; segs.push(cur); }
    });
    return segs;
  }

  // 한 섹션의 줄들을 행(row) × 열(col) 셀로 분해
  function toRows(lines, cols) {
    var rows = [], cur = null, lastY = null;
    // 페이지 첫 줄: 그 줄이 속한 묶음(행)에 첫 열 글자가 있으면 새 행, 없으면 이전 페이지 행의 연속
    lines.forEach(function (L, i) {
      if (!L.pageStart) return;
      var has = false;
      for (var j = i; j < lines.length; j++) {
        if (j > i && lines[j - 1].y - lines[j].y > ROW_GAP) break;
        if (lines[j].its[0].x < cols[1] - 3) { has = true; break; }
      }
      L.pageNewRow = has;
    });
    lines.forEach(function (L) {
      var newRow = lastY === null || lastY - L.y > ROW_GAP || (L.pageStart && L.pageNewRow);
      if (newRow) { cur = { lines: [] }; rows.push(cur); }
      cur.lines.push(L);
      lastY = L.y;
    });
    return rows.map(function (r) {
      var cells = cols.map(function () { return []; });
      r.lines.forEach(function (L) {
        segments(L, cols).forEach(function (sg) { cells[colIndex(cols, sg.x)].push(joinItems(sg.its)); });
      });
      return cells.map(joinCellLines);
    });
  }

  function isHeaderRow(cells, words) {
    var t = cells.join(' ');
    return words.some(function (w) { return t.indexOf(w) >= 0; }) && !/^(D|A|OI)-\d/.test(cells[0]);
  }

  // ---------- 섹션별 해석 ----------
  function parseKV(rows) {
    var kv = {};
    rows.forEach(function (c) {
      var label = c[0];
      var val = c.slice(1).filter(Boolean).join(' ');
      if (label) kv[label] = clean((kv[label] ? kv[label] + ' ' : '') + val);
    });
    return kv;
  }

  function parseHeader(rows) {
    var kv = {};
    rows.forEach(function (c) {
      // [라벨0, 값0, 라벨1, 값1] 또는 [라벨0, '', 값(넓은 칸)]
      if (HDR_LABELS.indexOf(c[2]) >= 0) {
        if (c[0]) kv[c[0]] = clean(c[1]);
        kv[c[2]] = clean(c[3]);
      } else if (c[0]) {
        kv[c[0]] = clean([c[1], c[2], c[3]].filter(Boolean).join(' '));
      }
    });
    // "회의번호 ML-OL-001 일시 ..." 처럼 한 칸에 붙은 경우 대비
    return kv;
  }

  function splitList(s, sep) {
    return String(s || '').split(sep).map(clean).filter(Boolean);
  }

  var TITLE_RE = /\s*(대표이사|팀장|매니저|책임|AE|파트장|본부장|이사|실장|과장|대리|사원|선임|수석|담당|리드|PM|디자이너|연구원|품질책임|개발책임|MD|바이어|Account Director)$/;

  // 부서명 표준화 (외부 협력사는 외부 조직으로 묶는다)
  var DEPT_ALIAS = [
    [/^재무$|경영지원/, '경영지원·재무'],
    [/^브랜드|마케팅$/, '브랜드마케팅'],
    [/푸드앤코|ODM/, '외부 ODM'],
    [/스파크웍스|대행/, '외부 대행사'],
    [/^SCM|품질$/, 'SCM·품질']

  function normDept(d) {
    d = clean(d);
    for (var i = 0; i < DEPT_ALIAS.length; i++) if (DEPT_ALIAS[i][0].test(d)) return DEPT_ALIAS[i][1];
    return d;
  }

  function parseAttendees(s) {
    return splitList(s, /,|，/).map(function (p) {
      var m = p.match(/^([가-힣]{2,4})\s+(.+)$/);
      // 줄바꿈으로 이름과 직함이 붙은 경우: "이수민브랜드마케팅 매니저"
      if (!m || m[1].length > 3) m = p.match(/^([가-힣]{3})\s*(.+)$/) || m;
      if (!m) return { name: p, role: '', dept: '' };
      var role = clean(m[2]);
      return { name: m[1], role: role, dept: normDept(role.replace(TITLE_RE, '')) || role };
    });
  }

  function parseDateTime(s) {
    var m = String(s || '').match(/(\d{4})\.(\d{1,2})\.(\d{1,2})\s*\(?([월화수목금토일])?\)?\s*(\d{1,2}:\d{2})?\s*-?\s*(\d{1,2}:\d{2})?/);
    if (!m) return {};
    var date = m[1] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[3]).slice(-2);
    var dur = null;
    if (m[5] && m[6]) {
      var a = m[5].split(':'), b = m[6].split(':');
      dur = (+b[0] * 60 + +b[1]) - (+a[0] * 60 + +a[1]);
    }
    return { date: date, dow: m[4] || '', start: m[5] || '', end: m[6] || '', durationMin: dur };
  }

  function parseMeetingBlock(block) {
    var m = { sections: {} };
    var hdr = parseHeader(toRows(block.hdr, LAYOUT.hdr));
    m.id = hdr['회의번호'] || block.id;
    m.no = parseInt((m.id.match(/(\d+)\s*$/) || [0, 0])[1], 10);
    m.title = block.title;
    m.stage = hdr['프로젝트 단계'] || block.stage || '';
    var dt = parseDateTime(hdr['일시']);
    m.datetime = hdr['일시'] || '';
    m.date = dt.date || '';
    m.dow = dt.dow || '';
    m.start = dt.start || '';
    m.end = dt.end || '';
    m.durationMin = dt.durationMin;
    m.nature = hdr['회의 성격'] || '';
    m.typeRaw = hdr['회의 유형'] || '';
    m.place = hdr['장소'] || '';
    m.chair = hdr['주재자'] || '';
    m.recorder = hdr['기록자'] || '';
    m.reason = hdr['회의 소집 사유'] || '';
    m.depts = splitList(hdr['참석 부서'], '/').map(normDept).filter(function (d, i, a) { return a.indexOf(d) === i; });
    m.attendees = parseAttendees(hdr['참석자']);
    m.purpose = hdr['회의 목적'] || '';
    m.agendaRaw = hdr['안건'] || '';
    m.agenda = splitList(m.agendaRaw.replace(/[①②③④⑤⑥⑦⑧⑨⑩]/g, '|'), '|');

    var S = block.sections;
    // 01 성과 피드백
    m.closedLoop = [];
    if (S['01']) toRows(S['01'], LAYOUT['01']).forEach(function (c) {
      if (isHeaderRow(c, ['관련 ID', '당시 목표'])) return;
      if (!c.join('')) return;
      m.closedLoop.push({ ref: c[0], target: c[1], result: c[2], eval: c[3], next: c[4] });
    });
    // 02 연계정보
    var kv2 = S['02'] ? parseKV(toRows(S['02'], LAYOUT['02'])) : {};
    m.link = {
      prev: kv2['전 회의 연계사항'] || '',
      prevActionStatus: kv2['이전 Action 상태'] || '',
      kpi: kv2['이번 회의 핵심 KPI'] || '',
      dataBasis: kv2['데이터 기준'] || ''

    // 03 논의
    m.discussions = [];
    if (S['03']) toRows(S['03'], LAYOUT['03']).forEach(function (c) {
      if (isHeaderRow(c, ['주요 논의내용', '회의 결론'])) return;
      if (!c.join('')) return;
      var speakers = [];
      (c[1] + ' ' + c[2]).replace(/([가-힣]{3}):/g, function (_, n) { if (speakers.indexOf(n) < 0) speakers.push(n); });
      m.discussions.push({ topic: c[0], discussion: c[1], dissent: c[2], conclusion: c[3], speakers: speakers });
    });
    // 04 결정
    m.decisions = []; m.reserved = '';
    if (S['04']) toRows(S['04'], LAYOUT['04']).forEach(function (c) {
      if (isHeaderRow(c, ['Decision ID', '결정사항'])) return;
      if (/^유보/.test(c[0])) { m.reserved = clean(c.slice(1).join(' ')); return; }
      var id = (c[0].match(/D-\d+/) || [''])[0];
      if (!id) return;
      m.decisions.push({ id: id, text: c[1], status: c[2], condition: c[3] === '-' ? '' : c[3] });
    });
    // 05 이슈
    m.issues = [];
    if (S['05']) toRows(S['05'], LAYOUT['05']).forEach(function (c) {
      if (isHeaderRow(c, ['Issue ID', 'Owner'])) return;
      var id = (c[0].match(/OI-\d+/) || [''])[0];
      if (!id) return;
      m.issues.push({ id: id, text: c[1], status: c[2], owner: c[3], condition: c[4] });
    });
    // 05A 위기
    m.crisis = null;
    if (S['05A']) {
      var kv5 = parseKV(toRows(S['05A'], LAYOUT['05A']));
      m.crisis = {
        event: kv5['사건'] || '',
        control: kv5['즉시 통제'] || '',
        cause: kv5['원인 가설/확인'] || kv5['근본원인'] || kv5['원인'] || '',
        prevention: kv5['재발방지'] || '',
        closure: kv5['종결 기준'] || ''
      };
    }
    // 06 액션
    m.actions = [];
    if (S['06']) toRows(S['06'], LAYOUT['06']).forEach(function (c) {
      if (isHeaderRow(c, ['Action ID', '업무지시사항'])) return;
      var id = (c[0].match(/A-\d+/) || [''])[0];
      if (!id) return;
      m.actions.push({ id: id, task: c[1], owners: splitList(c[2], '/'), priority: c[3], due: c[4], status: c[5], criteria: c[6] });
    });
    // 07 후속
    var kv7 = S['07'] ? parseKV(toRows(S['07'], LAYOUT['07'])) : {};
    m.schedule = kv7['향후 업무일정'] || '';
    m.followup = kv7['후속조치'] || '';
    m.nextMeeting = kv7['다음 회의'] || '';
    // 08 문서
    var kv8 = S['08'] ? parseKV(toRows(S['08'], LAYOUT['08'])) : {};
    m.refs = kv8['참고자료 / 첨부'] || '';
    m.approval = kv8['작성·검토·승인'] || '';
    return m;
  }

  // 페이지별 아이템 배열 → 회의 블록 분할
  function parsePages(pages) {
    var blocks = [], cur = null, sec = null, meta = { project: '', company: '' };
    var pendingPageStart = false;
    pages.forEach(function (items, pi) {
      var lines = toLines(items);
      pendingPageStart = true;
      for (var i = 0; i < lines.length; i++) {
        var L = lines[i], t = clean(lineText(L));
        var first = L.its[0];
        var mHead = t.match(/^((?:[A-Z]{1,4}-){1,3}\d{2,4})\s*\|\s*(.*)$/);
        if (first.x < 42 && mHead) {
          cur = { id: mHead[1], stage: clean(mHead[2]), title: '', hdr: [], sections: {}, page: pi + 1 };
          blocks.push(cur); sec = 'title'; pendingPageStart = false;
          continue;
        }
        if (!cur) {
          if (!meta.company && /주식회사|Inc\./.test(t)) meta.company = t;
          continue;
        }
        if (sec === 'title' && first.x < 42) { cur.title = cur.title ? cur.title + ' ' + t : t; continue; }
        var mSec = first.x < 42 && t.match(/^(0\d[A-Z]?)(?=\s|[가-힣])/);
        if (mSec) { sec = mSec[1]; cur.sections[sec] = cur.sections[sec] || []; pendingPageStart = false; continue; }
        if (sec === 'title') sec = 'hdr';
        // 페이지마다 반복되는 표 머리글은 건너뛴다
        if (/^(관련 ID|Decision ID|Issue ID|Action ID|안건 주요 논의내용)/.test(t)) continue;
        if (pendingPageStart) { L.pageStart = true; pendingPageStart = false; }
        if (sec === 'hdr') cur.hdr.push(L);
        else if (cur.sections[sec]) cur.sections[sec].push(L);
      }
    });
    return blocks.map(parseMeetingBlock);
  }

  // pdf.js 로 PDF 읽기 → 페이지별 아이템
  function extractPdf(pdfjsLib, data) {
    return pdfjsLib.getDocument({ data: data }).promise.then(function (doc) {
      var ps = [];
      for (var p = 1; p <= doc.numPages; p++) {
        ps.push(doc.getPage(p).then(function (page) {
          return page.getTextContent().then(function (tc) {
            return tc.items.map(function (i) {
              return { x: i.transform[4], y: i.transform[5], w: i.width, s: i.str };
            });
          });
        }));
      }
      return Promise.all(ps);
    });
  }

  function parsePdf(pdfjsLib, data) {
    return extractPdf(pdfjsLib, data).then(parsePages);
  }

  var api = { normDept: normDept, parsePages: parsePages, parsePdf: parsePdf, extractPdf: extractPdf, LAYOUT: LAYOUT };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.MeetingParser = api;
})(typeof window !== 'undefined' ? window : globalThis);

    'BREAK BAR': /BREAK ?BAR/gi, 'Vanilla Light': /Vanilla ?Light|바닐라/g, '저회전점': /저회전/g, 'CAPA': /CAPA/g
  };

  var DEPTS = ['대표이사', '브랜드마케팅', '상품기획', '디자인', '영업유통', '데이터전략', 'SCM·품질', '경영지원·재무', '고객경험', '외부 ODM', '외부 대행사'];
  var DEPT_SHORT = {
    '대표이사': '대표', '브랜드마케팅': '마케팅', '상품기획': '상품', '디자인': '디자인', '영업유통': '영업',
    '데이터전략': '데이터', 'SCM·품질': 'SCM', '경영지원·재무': '재무', '고객경험': 'CX', '외부 ODM': 'ODM', '외부 대행사': '대행사'
  };
  // 본문에서 부서를 지칭하는 표현
  var DEPT_MENTION = [
    ['대표이사', /대표(?!이사)|대표이사/g], ['브랜드마케팅', /브랜드팀|브랜드는|브랜드 측|마케팅|브랜드$/g], ['상품기획', /상품팀|상품기획|상품은/g],
    ['디자인', /디자인팀|디자인은/g], ['영업유통', /영업/g], ['데이터전략', /데이터팀|데이터전략|데이터는/g],
    ['SCM·품질', /SCM|품질팀|품질은/g], ['경영지원·재무', /재무/g], ['외부 ODM', /ODM/g], ['외부 대행사', /대행사/g]
  ];

  // ---------- 유틸 ----------
  function uniq(a) { return a.filter(function (v, i) { return a.indexOf(v) === i; }); }
  function count(str, re) { var m = String(str || '').match(re); return m ? m.length : 0; }
  function sum(a) { return a.reduce(function (s, v) { return s + v; }, 0); }
  function toDate(s) { return s ? new Date(s + 'T00:00:00') : null; }
  function days(a, b) { return Math.round((toDate(b) - toDate(a)) / 86400000); }
  function pct(a, b) { return b ? Math.round(a / b * 1000) / 10 : 0; }

  // 장소 → 건물 / 층 / 공간 / 원격 연결
  function parseSite(place) {
    var main = String(place || '').split('+')[0].trim(), remote = (String(place).split('+')[1] || '').trim();
    var m = main.match(/^(.+?)\s+(B?\d+)F\s+(.+)$/);
    var site = m ? { building: m[1], floor: m[2], room: m[3] } : { building: main.replace(/\s*(회의실|사무실)$/, '') || '기타', floor: '', room: (main.match(/(회의실|사무실)$/) || ['회의실'])[0] };
    site.key = site.building + (site.floor ? ' ' + site.floor + 'F' : '') + ' · ' + site.room;
    site.remote = remote;
    return site;
  }

  function classifyTypes(raw) {
    var t = TYPE_RULES.filter(function (r) { return r[1].test(raw); }).map(function (r) { return r[0]; });
    return t.length ? t : ['의사결정'];
  }
  function classifyPhase(stage, title) {
    var s = stage + ' ' + (title || '');
    for (var i = 0; i < PHASE_RULES.length; i++) if (PHASE_RULES[i][1].test(stage)) return PHASE_RULES[i][0];
    for (i = 0; i < PHASE_RULES.length; i++) if (PHASE_RULES[i][1].test(s)) return PHASE_RULES[i][0];
    return '기획';
  }

  // 마감일 "MM.DD" → 회의일 기준 연도 추정
  function dueDate(due, meetingDate) {
    var m = String(due || '').match(/(\d{1,2})\.(\d{1,2})/);
    if (!m || !meetingDate) return '';
    var y = +meetingDate.slice(0, 4), mm = +m[1], md = +meetingDate.slice(5, 7);
    if (mm < md - 6) y += 1;
    return y + '-' + ('0' + mm).slice(-2) + '-' + ('0' + m[2]).slice(-2);
  }

  // ---------- 상태 정규화 ----------
  function decisionBucket(st) {
    st = st || '';
    if (/보류/.test(st)) return '보류';
    if (/잠정/.test(st)) return '잠정';
    if (/조건부|예외/.test(st)) return '조건부';
    return '확정';
  }
  function approvalLevel(st) { return /대표|긴급|예외/.test(st || '') ? '대표·긴급 승인' : '팀 확정'; }

  function evalBucket(ev) {
    ev = ev || '';
    if (/기준선|N\/A/.test(ev) || !ev) return '기준선';
    if (/혼합|\/.*미달|달성\(.*\).*미달/.test(ev)) return '혼합';
    if (/중대 미달|미달/.test(ev) && !/달성/.test(ev.replace(/미달/g, ''))) return '미달';
    if (/부분/.test(ev)) return '부분달성';
    if (/초과/.test(ev)) return '초과';
    if (/주의/.test(ev)) return '달성(주의)';
    if (/달성/.test(ev)) return '달성';
    if (/미달/.test(ev)) return '미달';
    return '혼합';
  }

  function issueBucket(st) {
    st = (st || '').toUpperCase();
    if (/PARTIAL/.test(st)) return '부분종결';
    if (/CLOSED/.test(st)) return '종결';
    if (/TRANSFER/.test(st)) return '이관';
    if (/MONITOR/.test(st)) return '모니터링';
    return '오픈';
  }

  // 다음 회의의 "이전 Action 상태" 문장에서 액션별 결과 추출
  function parseActionFollowups(text) {
    var out = {};
    if (!text) return out;
    var parts = text.split(/\s\/\s|(?<=\.)\s|\.\s/);
    parts.forEach(function (p) {
      var ids = p.match(/A-\d{3}/g);
      if (!ids) return;
      var st = null;
      if (/부분완료|\d{2}% ?(완료|진행)|진행중|진행|설계중/.test(p) && !/[^부분]완료\(/.test(p)) {
        st = /부분완료|\d{2}% ?완료/.test(p) ? '부분완료' : '진행중';
      }
      if (/완료/.test(p) && !/부분완료|\d{2}% ?완료|완료 예정/.test(p)) st = '완료';
      if (/완료 예정/.test(p)) st = st || '진행중';
      var delayed = /지연/.test(p);
      ids.forEach(function (id) {
        var prev = out[id] || {};
        out[id] = { status: st || prev.status || '진행중', delayed: delayed || prev.delayed || false, note: p.trim() };
      });
    });
    return out;
  }

  // ---------- 메인 분석 ----------
  function analyze(meetings, opts) {
    opts = opts || {};
    function byDate(a, b) { return (a.date || '').localeCompare(b.date || '') || a.no - b.no; }
    var ms = meetings.slice().sort(byDate);
    // 추적용 전체 회의 (필터와 무관하게 후속 회의의 상태 기록을 읽는다)
    var all = (opts.all || meetings).slice().sort(byDate);
    var inView = {};
    ms.forEach(function (m) { inView[m.id] = true; });

    // 사람 → 부서 사전
    var personDept = {};
    all.forEach(function (m) {
      m.attendees.forEach(function (a) { if (a.name && a.dept) personDept[a.name] = a.dept; });
      [m.chair, m.recorder].forEach(function (s) {
        var mm = String(s || '').match(/^([가-힣]{2,4})\s+(.+)$/);
        if (mm && !personDept[mm[1]]) personDept[mm[1]] = root.MeetingParser ? root.MeetingParser.normDept(mm[2].replace(/(팀장|매니저|AE|책임|대표이사)$/, '')) : mm[2];
      });
    });
    function deptOf(name) { return personDept[String(name).trim()] || '기타'; }

    all.forEach(function (m) {
      m.types = classifyTypes(m.typeRaw);
      m.phase = classifyPhase(m.stage, m.title);
      m.chairName = (m.chair.match(/^[가-힣]{2,4}/) || [''])[0];
      m.chairDept = deptOf(m.chairName) === '기타' && /대표/.test(m.chair) ? '대표이사' : deptOf(m.chairName);
      m.recorderName = (m.recorder.match(/^[가-힣]{2,4}/) || [''])[0];
      m.building = (m.place.match(/^(본사|푸드앤코|[^ ]+)/) || [''])[0];
      m.room = m.place.replace(/\s*\+.*$/, '');
      m.hybrid = /화상|\+/.test(m.place);
      m.site = parseSite(m.place);
    });

    // --- 액션: 후속 회의에서 최종 상태 추적
    var follow = {};
    all.forEach(function (m) {
      var f = parseActionFollowups(m.link.prevActionStatus);
      Object.keys(f).forEach(function (id) { follow[id] = Object.assign({ meeting: m.id, date: m.date }, f[id]); });
      m.closedLoop.forEach(function (c) {
        (c.ref.match(/A-\d{3}/g) || []).forEach(function (id) {
          if (!follow[id]) follow[id] = { status: /달성/.test(c.eval) && !/부분/.test(c.eval) ? '완료' : '부분완료', delayed: /지연/.test(c.result), meeting: m.id, date: m.date };
        });
      });
    });
    var actions = [];
    ms.forEach(function (m) {
      m.actions.forEach(function (a) {
        var f = follow[a.id];
        var status = f ? f.status : (/예정/.test(a.status) ? '미착수' : /지연/.test(a.status) ? '진행중' : '진행중');
        var delayed = (f && f.delayed) || /지연/.test(a.status);
        var owners = a.owners;
        var depts = uniq(owners.map(deptOf));
        actions.push({
          id: a.id, task: a.task, owners: owners, ownerDepts: depts, dept: depts[0] || '기타', collab: depts.slice(1),
          priority: /최우선|긴급/.test(a.priority) ? '최우선' : a.priority, start: m.date, due: dueDate(a.due, m.date),
          rawStatus: a.status, status: status, delayed: delayed, done: status === '완료', criteria: a.criteria,
          followNote: f ? f.note : '', followMeeting: f ? f.meeting : '', meeting: m.id, meetingNo: m.no
        });
      });
    });

    // --- 결정
    var decisions = [];
    ms.forEach(function (m) {
      m.decisions.forEach(function (d) {
        var review = (d.condition.match(/(\d{1,2}\/\d{1,2}|\d{1,2} ?월)/) || [''])[0];
        decisions.push({
          id: d.id, text: d.text, statusRaw: d.status, status: decisionBucket(d.status), level: approvalLevel(d.status),
          condition: d.condition, conditional: !!d.condition && d.condition !== '-', review: review,
          date: m.date, meeting: m.id, meetingNo: m.no, chair: m.chair, chairDept: m.chairDept,
          refs: uniq((d.text + ' ' + d.condition).match(/D-\d{3}/g) || []).filter(function (x) { return x !== d.id; })
        });
      });
    });

    // --- 이슈 라이프사이클
    var issueMap = {};
    all.forEach(function (m) {
      m.issues.forEach(function (i) {
        var it = issueMap[i.id] || (issueMap[i.id] = { id: i.id, title: i.text, history: [], owners: [] });
        it.history.push({ meeting: m.id, no: m.no, date: m.date, status: issueBucket(i.status), raw: i.status, cond: i.condition });
        it.owners = uniq(it.owners.concat(i.owner.split('/').map(function (s) { return s.trim(); })));
        if (i.text.length > it.title.length) it.title = i.text;
      });
    });
    // 본문에 적힌 종결 기록 (예: "OI-013 도 10/13 API 승인으로 CLOSED")
    all.forEach(function (m) {
      var txt = [m.link.prevActionStatus, m.link.prev].concat(m.discussions.map(function (d) { return d.conclusion; })).join(' ');
      var re = /(OI-\d{3})[^|]{0,40}?(CLOSED|종결)/g, mm;
      while ((mm = re.exec(txt))) {
        var it = issueMap[mm[1]];
        if (it && !it.history.some(function (h) { return h.meeting === m.id; })) it.history.push({ meeting: m.id, no: m.no, date: m.date, status: '종결', raw: 'CLOSED(본문)', cond: '' });
      }
    });
    var lastDate = (all[all.length - 1] || {}).date;
    var issues = Object.keys(issueMap).sort().filter(function (k) {
      return issueMap[k].history.some(function (h) { return inView[h.meeting]; });
    }).map(function (k) {
      var it = issueMap[k], h = it.history;
      it.first = h[0]; it.last = h[h.length - 1];
      it.status = it.last.status;
      it.mentions = h.length;
      h.sort(function (a, b) { return a.date.localeCompare(b.date); });
      it.first = h[0]; it.last = h[h.length - 1]; it.status = it.last.status;
      var closed = it.status === '종결' || it.status === '이관' || it.status === '부분종결';
      // 종결 기록 없이 이후 회의에서 사라진 이슈
      it.untracked = !closed && it.last.date < lastDate;
      it.openDays = days(h[0].date, closed ? it.last.date : lastDate);
      it.depts = uniq(it.owners.map(deptOf));
      return it;
    });

    // --- 논의 분석
    var discussions = [];
    ms.forEach(function (m) {
      m.discussions.forEach(function (d) {
        var text = d.topic + ' ' + d.discussion + ' ' + d.dissent + ' ' + d.conclusion;
        var scores = TOPICS.map(function (t) { return count(text, t.re) + count(d.topic, t.re) * 2; });
        var best = scores.indexOf(Math.max.apply(null, scores));
        var dissentDepts = [];
        var dText = d.discussion + ' ' + d.dissent;
        DEPT_MENTION.forEach(function (dm) { if (count(dText, dm[1])) dissentDepts.push(dm[0]); });
        d.speakers.forEach(function (s) { var dd = deptOf(s); if (dd !== '기타') dissentDepts.push(dd); });
        var res = /보류|연기|재논의|추가 관찰|이후 결정|미확정|논의\./.test(d.conclusion) ? '보류·연기'
          : /절충|축소|분할|제한|한정|단계|일부|우선 확정|대신/.test(d.conclusion) ? '절충'
          : /조건|하되|단,|기준으로|경우/.test(d.conclusion) ? '조건부 채택' : '채택';
        discussions.push({
          meeting: m.id, meetingNo: m.no, date: m.date, topic: d.topic, category: TOPICS[best].key, scores: scores,
          discussion: d.discussion, dissent: d.dissent, conclusion: d.conclusion, hasDissent: !!d.dissent,
          depts: uniq(dissentDepts), speakers: d.speakers, resolution: res
        });
      });
    });
    var topicShare = TOPICS.map(function (t, i) {
      var n = sum(discussions.map(function (d) { var s = sum(d.scores); return s ? d.scores[i] / s : 0; }));
      return { key: t.key, value: n };
    });
    var tot = sum(topicShare.map(function (t) { return t.value; })) || 1;
    topicShare.forEach(function (t) { t.pct = Math.round(t.value / tot * 1000) / 10; });
    topicShare.sort(function (a, b) { return b.value - a.value; });

    // 키워드 빈도 (논의+결정+이슈 전문)
    var corpus = ms.map(function (m) {
      return [m.title, m.agendaRaw].concat(m.discussions.map(function (d) { return d.topic + ' ' + d.discussion + ' ' + d.dissent + ' ' + d.conclusion; }),
        m.decisions.map(function (d) { return d.text + ' ' + d.condition; }), m.issues.map(function (i) { return i.text; })).join(' ');
    });
    var keywords = KEYWORDS.map(function (k) {
      var re = KEYWORD_RE[k] || new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
      var perMeeting = corpus.map(function (c) { return count(c, re); });
      return { key: k, count: sum(perMeeting), meetings: perMeeting.filter(Boolean).length, perMeeting: perMeeting };
    }).filter(function (k) { return k.count > 0; }).sort(function (a, b) { return b.count - a.count; });

    // 부서 간 이견 쌍
    var conflictPairs = {};
    discussions.forEach(function (d) {
      if (!d.hasDissent) return;
      var ds = d.depts.filter(function (x) { return x !== '기타'; });
      for (var i = 0; i < ds.length; i++) for (var j = i + 1; j < ds.length; j++) {
        var k = [ds[i], ds[j]].sort().join('|');
        conflictPairs[k] = (conflictPairs[k] || 0) + 1;
      }
    });

    // --- 부서 분석
    var deptList = uniq(DEPTS.concat(ms.reduce(function (a, m) { return a.concat(m.depts); }, []))).filter(function (d) {
      return ms.some(function (m) { return m.depts.indexOf(d) >= 0; }) || actions.some(function (a) { return a.ownerDepts.indexOf(d) >= 0; });
    });
    var depts = deptList.map(function (d) {
      var attended = ms.filter(function (m) { return m.depts.indexOf(d) >= 0; });
      var acts = actions.filter(function (a) { return a.ownerDepts.indexOf(d) >= 0; });
      var lead = actions.filter(function (a) { return a.dept === d; });
      var mentions = sum(discussions.map(function (x) { return x.depts.indexOf(d) >= 0 ? 1 : 0; }));
      return {
        dept: d, short: DEPT_SHORT[d] || d, meetings: attended.length, chaired: ms.filter(function (m) { return m.chairDept === d; }).length,
        decisions: sum(attended.map(function (m) { return m.decisions.length; })), actions: acts.length, leadActions: lead.length,
        done: acts.filter(function (a) { return a.done; }).length, delayed: acts.filter(function (a) { return a.delayed; }).length,
        partial: acts.filter(function (a) { return a.status === '부분완료'; }).length, mentions: mentions,
        people: uniq(Object.keys(personDept).filter(function (p) { return personDept[p] === d; }))
      };
    });
    depts.forEach(function (d) { d.doneRate = pct(d.done, d.actions); d.delayRate = pct(d.delayed, d.actions); });
    // 협업 네트워크: 공동 담당 액션 + 같은 논의에서 함께 언급
    var collab = {};
    function addEdge(a, b, w, kind) {
      if (a === b || a === '기타' || b === '기타') return;
      var k = [a, b].sort().join('|');
      var e = collab[k] || (collab[k] = { a: [a, b].sort()[0], b: [a, b].sort()[1], action: 0, discussion: 0 });
      e[kind] += w;
    }
    actions.forEach(function (a) {
      for (var i = 0; i < a.ownerDepts.length; i++) for (var j = i + 1; j < a.ownerDepts.length; j++) addEdge(a.ownerDepts[i], a.ownerDepts[j], 1, 'action');
    });
    discussions.forEach(function (d) {
      for (var i = 0; i < d.depts.length; i++) for (var j = i + 1; j < d.depts.length; j++) addEdge(d.depts[i], d.depts[j], 1, 'discussion');
    });
    var edges = Object.keys(collab).map(function (k) { var e = collab[k]; e.weight = e.action * 2 + e.discussion; return e; })
      .sort(function (a, b) { return b.weight - a.weight; });

    // --- 사람
    var people = {};
    ms.forEach(function (m) {
      m.attendees.forEach(function (a) {
        var p = people[a.name] || (people[a.name] = { name: a.name, dept: a.dept, role: a.role, meetings: [], chaired: 0, recorded: 0, actions: 0 });
        p.meetings.push(m.no);
      });
      if (people[m.chairName]) people[m.chairName].chaired++;
      if (people[m.recorderName]) people[m.recorderName].recorded++;
    });
    actions.forEach(function (a) { a.owners.forEach(function (o) { if (people[o]) people[o].actions++; }); });

    // --- 성과 추적 (Closed Loop)
    var loops = [];
    ms.forEach(function (m) {
      m.closedLoop.forEach(function (c) {
        var b = evalBucket(c.eval);
        if (b === '기준선') return;
        loops.push({ meeting: m.id, meetingNo: m.no, date: m.date, ref: c.ref, target: c.target, result: c.result, evalRaw: c.eval, eval: b, next: c.next });
      });
    });

    // --- 위기
    var crises = ms.filter(function (m) { return m.crisis; }).map(function (m) {
      var t = m.crisis.event + ' ' + m.crisis.cause + ' ' + m.title;
      var type = /표현|게시물|크리에이터|콘텐츠|커뮤니케이션|브랜드/.test(t) ? '커뮤니케이션'

<script>
/*
 * 인포그래픽 부품 (SVG/HTML)

 */
(function (root) {
  'use strict';

  }

  function mix(a, b, t) {

  }
  function f1(n) { return Math.round(n * 10) / 10; }
  function pts(arr) { return arr.map(function (p) { return f1(p[0]) + ',' + f1(p[1]); }).join(' '); }

  // =====================================================================
  // 회의 장소 도면 (층별 분해 아이소메트릭)
  // =====================================================================
  var W = 460, D = 170, G = 118;
  var SLOTS = [[10, 92, 150, 68], [300, 92, 150, 68], [170, 92, 120, 68], [10, 10, 120, 70], [330, 10, 120, 70]];
  var CORE = [140, 10, 80, 70], LOUNGE = [230, 10, 90, 70];

  function floorPlan(meetings, opt) {
    opt = opt || {};
    var T = opt.tokens, compact = !!opt.compact, sel = opt.selected || [];
    var dark = T.dark;
    // 장소별 집계
    var rooms = {};
    meetings.forEach(function (m) {
      var s = m.site; if (!s) return;
      var r = rooms[s.key] || (rooms[s.key] = { key: s.key, building: s.building, floor: s.floor, room: s.room, list: [], remote: [] });
      r.list.push(m);
      if (s.remote) r.remote.push({ m: m, to: s.remote });
    });
    var allRooms = opt.allRooms || rooms;
    var hqName = mostCommonBuilding(allRooms);
    var floorsAll = uniq(Object.keys(allRooms).map(function (k) { return allRooms[k]; }).filter(function (r) { return r.building === hqName && r.floor; }).map(function (r) { return +r.floor; })).sort(function (a, b) { return a - b; });
    if (!floorsAll.length) floorsAll = [1];
    var lo = floorsAll[0], hi = floorsAll[floorsAll.length - 1];
    var floors = []; for (var f = lo; f <= hi; f++) floors.push(f);
    var externals = uniq(Object.keys(allRooms).map(function (k) { return allRooms[k]; }).filter(function (r) { return r.building !== hqName || !r.floor; }).map(function (r) { return r.building; }));
    var maxN = Math.max.apply(null, Object.keys(rooms).map(function (k) { return rooms[k].list.length; }).concat([1]));

    var ox = compact ? 60 : 78, baseY = 40 + (floors.length - 1) * G + 70 + 60;
    function P(x, y, z) { return [ox + x + y * 0.55, baseY + y * 0.3 - z]; }

    var ink = T.ink, ink2 = T.ink2, muted = T.muted, line = dark ? '#3a4557' : '#c9d1de', surf = T.surface;

        '<polygon points="' + pts([a2, b2, c2, e2]) + '" style="fill:' + top + ';stroke:' + stroke + ';stroke-width:' + sw + '"/></g>';

        '<circle cx="' + f1(c[0]) + '" cy="' + f1(c[1] - r * 0.6) + '" r="' + r + '" style="fill:' + greenDk + ';opacity:.85"/>' +
        '<circle cx="' + f1(c[0] - r * 0.35) + '" cy="' + f1(c[1] - r * 0.9) + '" r="' + f1(r * 0.55) + '" style="fill:' + mix(greenDk, '#ffffff', 0.35) + '"/>';
    }

      });

    floors.forEach(function (fl, fi) {

      // 층 라벨

      svg.push('<text x="' + f1(lp[0] - 14) + '" y="' + f1(lp[1] - 2) + '" text-anchor="end" style="font-size:' + (compact ? 22 : 20) + 'px;font-weight:800;fill:' + muted + ';letter-spacing:-.02em">' + fl + 'F</text>');
      var fr = Object.keys(allRooms).map(function (k) { return allRooms[k]; }).filter(function (r) { return r.building === hqName && +r.floor === fl; });
      fr.sort(function (a, b) { return (rooms[b.key] ? rooms[b.key].list.length : 0) - (rooms[a.key] ? rooms[a.key].list.length : 0) || a.room.localeCompare(b.room); });
      var used = fr.slice(0, SLOTS.length);
      // 그리기 순서: 뒤(y 작음) → 앞

      SLOTS.forEach(function (sl, i) { items.push({ sl: sl, r: used[i] || null }); });
      items.push({ sl: CORE, core: true });
      items.push({ sl: LOUNGE, lounge: true });
      items.sort(function (a, b) { return a.sl[1] - b.sl[1] || a.sl[0] - b.sl[0]; });
      items.forEach(function (it) {
        var s = it.sl;
        if (it.core) { svg.push(box(s[0], s[1], z, s[2], s[3], 3, slabSide, slabSide, line, 1)); return; }
        if (it.lounge) {

          svg.push(tree(s[0] + 25, s[1] + 30, z + 2, 7) + tree(s[0] + 55, s[1] + 22, z + 2, 9) + tree(s[0] + 68, s[1] + 50, z + 2, 6));

        }
        if (!it.r) { svg.push(box(s[0], s[1], z, s[2], s[3], 5, ctxTop, ctxTop, line, 1)); return; }

        var isSel = sel.indexOf(it.r.key) >= 0;
        if (!n) { svg.push(box(s[0] + 4, s[1] + 4, z, s[2] - 8, s[3] - 8, 8, ctxTop, ctxTop, line, 1, ' class="fp-room" data-place="' + esc(it.r.key) + '"')); return; }
        var h = 14 + n / maxN * 46;
        var top = mix(roomLo, roomHi, 0.15 + 0.75 * n / maxN), side = mix(top, dark ? '#000000' : '#1e3a8a', dark ? .2 : .18);

        var stroke = isSel ? ink : mix(top, '#1e3a8a', dark ? .1 : .35);

        svg.push('<g class="fp-room" data-place="' + esc(it.r.key) + '" role="button" tabindex="0" style="cursor:pointer"><title>' + esc(title) + '</title>' +
          box(s[0] + 4, s[1] + 4, z, s[2] - 8, s[3] - 8, h, top, side, stroke, isSel ? 2.2 : 1) +
          (urgent ? '' : '') + '</g>');
        // 윗면 숫자
        var tc = P(s[0] + s[2] / 2, s[1] + s[3] / 2, z + h);
        svg.push('<text x="' + f1(tc[0]) + '" y="' + f1(tc[1] + 4) + '" text-anchor="middle" style="font-size:' + (compact ? 15 : 13) + 'px;font-weight:800;fill:' + (n / maxN > 0.5 ? '#fff' : ink) + ';pointer-events:none">' + n + '</text>');
        if (urgent) {
          var up = P(s[0] + s[2] - 14, s[1] + 12, z + h);
          svg.push('<g style="pointer-events:none"><path d="M' + f1(up[0]) + ' ' + f1(up[1] - 13) + ' l7 12 h-14 z" style="fill:' + crit + ';stroke:' + surf + ';stroke-width:1.5"/><text x="' + f1(up[0]) + '" y="' + f1(up[1] - 3) + '" text-anchor="middle" style="font-size:8px;font-weight:900;fill:#fff">!</text></g>');
        }
        anchors[it.r.key] = P(s[0] + s[2] - 10, s[1] + s[3] / 2, z + h);
        callouts.push({ key: it.r.key, r: r, at: P(s[0] + s[2] * 0.7, s[1] + 8, z + h), sel: isSel, name: fl + 'F ' + it.r.room, urgent: urgent });
      });
    });

    // 외부 사이트 (예: 푸드앤코 이천공장)
    var extAnchor = {}, EXT_Y = D + 44;
    externals.forEach(function (b, i) {
      var r = Object.keys(allRooms).map(function (k) { return allRooms[k]; }).filter(function (x) { return x.building === b; })[0];
      var ew = 130, ed = 80, ex = W - ew - 10 - i * (ew + 30), ey = EXT_Y;
      var r2 = rooms[r.key], n = r2 ? r2.list.length : 0;
      var isSel = sel.indexOf(r.key) >= 0;
      svg.push(box(ex, ey, -6, ew, ed, 6, slabTop, slabSide, line, 1));
      svg.push(tree(ex + 18, ey + 16, 0, 7) + tree(ex + 112, ey + 74, 0, 6));
      var top = n ? mix(roomLo, roomHi, 0.15 + 0.75 * n / maxN) : ctxTop;
      var hh = n ? 14 + n / maxN * 46 : 8;

      extAnchor[b] = P(ex + 65, ey + 47, hh + 4);

    });

    });

    });

  function decisionGraphOpt(R, api, links) {
    var T = api.tokens();
    var ids = api.uniq([].concat.apply([], links.map(function (l) { return [l.from, l.to]; })));
    // 연결 요소별로 행 배치
    var parent = {}; ids.forEach(function (i) { parent[i] = i; });
    function find(x) { return parent[x] === x ? x : (parent[x] = find(parent[x])); }
    links.forEach(function (l) { parent[find(l.from)] = find(l.to); });
    var groups = {}; ids.forEach(function (i) { var r = find(i); (groups[r] = groups[r] || []).push(i); });
    var gl = Object.keys(groups).map(function (k) { return groups[k]; });
    var dmap = {}; R.decisions.forEach(function (d) { dmap[d.id] = d; });
    gl.sort(function (a, b) { return Math.min.apply(null, a.map(function (i) { return dmap[i].meetingNo; })) - Math.min.apply(null, b.map(function (i) { return dmap[i].meetingNo; })); });
    var nodes = [];
    gl.forEach(function (g, row) {
      var used = {};
      g.sort().forEach(function (id) {
        var d = dmap[id]; var k = d.meetingNo; used[k] = (used[k] || 0) + 1;
        nodes.push({ name: id, d: d, x: d.meetingNo * 60 + (used[k] - 1) * 26, y: row * 40 + (used[k] - 1) * 16, symbolSize: 14,
          itemStyle: { color: api.decisionColor(d.status), borderColor: T.surface, borderWidth: 2 } });
      });
    });
    return {
      _rows: gl.length,
      tooltip: {
        formatter: function (p) {
          if (p.dataType === 'edge') return '<b style="color:' + linkColor(T, p.data.type) + '">' + p.data.type + '</b> ' + p.data.source + ' → ' + p.data.target + '<br>' + api.esc(p.data.note || '');
          var d = p.data.d; return '<b>' + d.id + '</b> · ' + d.statusRaw + ' · ' + d.meeting + '<br>' + api.esc(d.text);
        }
      },
      series: [{
        type: 'graph', layout: 'none', roam: false, left: 40, right: 60, top: 56, bottom: 20,
        edgeSymbol: ['none', 'arrow'], edgeSymbolSize: 7,
        label: { show: true, position: 'top', fontSize: 10.5, color: T.ink2, fontWeight: 600, formatter: '{b}' },
        data: nodes,
        links: links.map(function (l) { return { source: l.from, target: l.to, type: l.type, note: l.note, lineStyle: { color: linkColor(T, l.type), width: l.type === '번복' ? 3 : 1.8, curveness: 0.12, opacity: 0.9 } }; }),
        emphasis: { focus: 'adjacency' }
      }]
    };
  }

  function action(p, R, api) {
    var T = api.tokens(), AC = R.actions, s = R.summary;
    if (!AC.length) { p.innerHTML = head('Action Item 관리', '') + empty(); return; }
    var st = {}; s.actionByStatus.forEach(function (x) { st[x.key] = x.value; });

  // 규칙 기반 자동 인사이트 (필터·업로드 데이터에 반응)
  function autoInsights(R, api) {

    if (s.actions) {
      var worst = R.depts.filter(function (d) { return d.actions >= 3; }).sort(function (a, b) { return a.doneRate - b.doneRate; })[0];

    }

    var e = R.edges[0];

    return out;
  }

    h += card('c12', '올해 문제 → 올해 학습 → 2027 반영 ' + ai(), '원문의 위기·미달 기록, KPT 회고, 020 최종 승인 결정을 연결했습니다',
      '<div class="pl-head"><span>영역</span><span>올해 문제</span><span>학습</span><span>2027 반영</span></div>' + ny.flows.map(function (f) {

          '<div class="pl-cell l">' + api.esc(f.learning) + '</div><div class="pl-cell n">' + api.esc(f.plan) + '<div class="ev">' + api.chips(f.planEv) + '</div></div></div>';
      }).join(''));
    h += card('c7', '전략 매트릭스 ' + ai(), '유지 · 중단 · 개선 · 신규', '<div class="matrix">' +
      [['유지', 'keep', '유지할 전략'], ['중단', 'stop', '중단할 전략'], ['개선', 'improve', '개선할 전략'], ['신규', 'new', '신규 시도']].map(function (x) {
        return '<div class="mq ' + x[1] + '"><h5>' + x[2] + ' <span class="pill">' + ny.strategy[x[0]].length + '</span></h5><ul>' + ny.strategy[x[0]].map(function (s) { return '<li>' + api.esc(s) + '</li>'; }).join('') + '</ul><div class="ev" style="margin-top:6px">' + api.chips(ny.strategyEv[x[0]].join(' ')) + '</div></div>';
      }).join('') + '</div>');
