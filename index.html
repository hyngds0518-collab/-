<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회의록 분석 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
</head>
<body>
<header class="app-header">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>
    </div>
    <div style="min-width:0">
      <h1>회의록 분석 대시보드</h1>
      <p id="projectLine">회의록 원문을 구조화해 결정·실행·성과·리스크를 한눈에 봅니다</p>
    </div>
  </div>
  <div class="header-actions">
    <span class="dataset-pill" id="datasetPill"></span>
    <button class="btn primary" id="btnUpload" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>
      회의록 업로드
    </button>
    <button class="btn" id="btnExport" type="button" title="현재 데이터를 JSON으로 저장">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></svg>
      JSON
    </button>
    <button class="btn icon" id="btnTheme" type="button" aria-label="테마 전환">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<div class="filter-wrap">
  <div class="filter-bar" id="filterBar" role="toolbar" aria-label="회의록 필터"></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="분석 영역"></nav>
</div>

<main id="main"></main>

<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-label="상세 보기">
  <div class="drawer-head">
    <div><h3 id="drawerTitle"></h3><div class="sub" id="drawerSub"></div></div>
    <button class="btn icon" id="drawerClose" type="button" aria-label="닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="modal-bg" id="modalBg">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="upTitle">
    <h3 id="upTitle">회의록 업로드</h3>
    <p class="desc">표준 양식(기본정보 + 01~08 섹션)의 회의록 PDF를 올리면 자동으로 구조화·분석해 대시보드에 반영합니다. 이 대시보드에서 내보낸 JSON 파일도 올릴 수 있습니다.</p>
    <label class="drop" id="drop" tabindex="0">
      <b>PDF 또는 JSON 파일을 끌어다 놓거나 클릭해서 선택</b>
      <span>여러 파일을 한 번에 올릴 수 있습니다 · 파일은 브라우저 안에서만 처리됩니다</span>
      <input type="file" id="fileIn" accept=".pdf,.json,application/pdf,application/json" multiple class="sr-only">
    </label>
    <div class="up-opts">
      <label><input type="radio" name="upMode" value="add" checked> 기존 데이터에 추가</label>
      <label><input type="radio" name="upMode" value="replace"> 업로드한 회의록만 보기</label>
    </div>
    <div class="up-log" id="upLog"></div>
    <div class="uploaded-list" id="uploadedList"></div>
    <div class="modal-foot">
      <button class="btn" id="btnClearUploads" type="button">업로드 데이터 삭제</button>
      <button class="btn primary" id="btnCloseModal" type="button">닫기</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/parser.js"></script>
<script src="assets/js/analytics.js"></script>
<script src="assets/data/base-data.js"></script>
<script src="assets/data/ai-annotations.js"></script>
<script src="assets/js/views.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
