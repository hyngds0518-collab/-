<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회의록 분석 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="assets/js/icons.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="메뉴">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 19V11M12 19V5M19 19v-6"/></svg>
      </div>
      <div class="brand-txt"><b>Meeting<span>Lens</span></b><small>회의록 분석</small></div>
    </div>
    <nav class="nav" id="tabs" role="tablist" aria-label="분석 영역"></nav>
    <div class="side-foot">
      <button type="button" class="side-help" id="sideMeetings" aria-current="false">
        <span class="ic-wrap tone-blue" id="sideHelpIcon"></span>
        <div><b>회의 목록</b><small id="sideSource">MOMENTLAB 회의록 20건</small></div>
        <span class="sh-go" aria-hidden="true">›</span>
      </button>
      <div class="side-promo">
        <div class="promo-art" id="promoArt"></div>
        <b>Private. Local. Smart.</b>
        <p>업로드한 회의록은 브라우저 안에서만 분석됩니다.</p>
      </div>
    </div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <div class="page-title">
        <h1 id="pageTitle">개요</h1>
        <p id="projectLine">회의록 원문을 구조화해 결정·실행·성과·리스크를 한눈에 봅니다</p>
      </div>
      <label class="search"><span id="searchIcon"></span><input type="search" id="fQ" placeholder="회의록 키워드 검색 (예: 품절)" aria-label="키워드 검색"></label>
      <div class="top-actions">
        <button class="btn primary" id="btnUpload" type="button"><span id="upIcon"></span>회의록 업로드</button>
        <button class="icon-btn" id="btnExport" type="button" title="현재 데이터를 JSON으로 저장" aria-label="JSON 내보내기"></button>
        <button class="icon-btn" id="btnTheme" type="button" aria-label="테마 전환"></button>
        <div class="me">
          <span class="me-av" id="meAv">ML</span>
          <div><b>MOMENT LAB</b><small id="datasetPill"></small></div>
        </div>
      </div>
    </header>
    <div class="filter-wrap">
      <div class="filter-bar" id="filterBar" role="toolbar" aria-label="회의록 필터"></div>
    </div>
    <main id="main"></main>
  </div>
</div>

<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-label="상세 보기">
  <div class="drawer-head">
    <div><h3 id="drawerTitle"></h3><div class="sub" id="drawerSub"></div></div>
    <button class="btn icon" id="drawerClose" type="button" aria-label="닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="modal-bg" id="modalBg">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="upTitle">
    <h3 id="upTitle">회의록 업로드</h3>
    <p class="desc">표준 양식(기본정보 + 01~08 섹션)의 회의록 PDF를 올리면 자동으로 구조화·분석해 대시보드에 반영합니다. 이 대시보드에서 내보낸 JSON 파일도 올릴 수 있습니다.</p>
    <label class="drop" id="drop" tabindex="0">
      <b>PDF 또는 JSON 파일을 끌어다 놓거나 클릭해서 선택</b>
      <span>여러 파일을 한 번에 올릴 수 있습니다 · 파일은 브라우저 안에서만 처리됩니다</span>
      <input type="file" id="fileIn" accept=".pdf,.json,application/pdf,application/json" multiple class="sr-only">
    </label>
    <div class="up-opts">
      <label><input type="radio" name="upMode" value="add" checked> 기존 데이터에 추가</label>
      <label><input type="radio" name="upMode" value="replace"> 업로드한 회의록만 보기</label>
    </div>
    <div class="up-log" id="upLog"></div>
    <div class="uploaded-list" id="uploadedList"></div>
    <div class="modal-foot">
      <button class="btn" id="btnClearUploads" type="button">업로드 데이터 삭제</button>
      <button class="btn primary" id="btnCloseModal" type="button">닫기</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/parser.js"></script>
<script src="assets/js/analytics.js"></script>
<script src="assets/data/base-data.js"></script>
<script src="assets/data/ai-annotations.js"></script>
<script src="assets/data/avatars.js"></script>
<script src="assets/js/infographics.js"></script>
<script src="assets/js/views.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
